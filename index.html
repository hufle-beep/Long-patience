<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111a20">
<title>Long Patience</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column ship console. Sticky readout header, scrolling task list, fixed tab bar. Single dark look (emergency lighting) by choice. */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
:root{
  --bg:#0b1115; --panel:#111a20; --panel2:#16222a; --line:#22323c; --fg:#d2dbe0; --dim:#7b8c96; --faint:#4a5c67;
  --amber:#f0a03c; --amber-soft:rgba(240,160,60,.14); --amber-fill:rgba(240,160,60,.22);
  --cyan:#63c6d4; --cyan-soft:rgba(99,198,212,.16); --red:#e2604f; --green:#7cc47f; --violet:#a98cf0; --sand:#d8c49a; --yellow:#f2d54b;
  --f-disp:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--dim);font-weight:600}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 10px}
#hud .wrap{display:grid;gap:7px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.ident{display:flex;align-items:center;gap:6px 8px;flex:0 1 auto;flex-wrap:wrap;white-space:nowrap}
.htimes{display:inline-flex;gap:10px;flex-wrap:wrap}
.ident .htimes span{font-family:var(--f-mono);font-size:13px;letter-spacing:0;text-transform:none}
.ident .hday{color:var(--green)}
.ident .hleft{color:var(--red)}
.ident b{white-space:nowrap;font-family:var(--f-disp);font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--amber);line-height:1}
.ident span{font-family:var(--f-disp);font-size:14px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.spd{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.spd button{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.spd button.on{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.spd button.mus{font-size:14px;padding:3px 9px;color:var(--faint);text-decoration:line-through}
.spd button.mus.on{color:var(--cyan);border-color:var(--cyan-soft);background:none;text-decoration:none}
.vol{display:grid;grid-template-columns:auto 1fr 34px;gap:10px;align-items:center}
.vol b{font-size:12px;text-align:right;font-weight:500}
.mpanel{background:var(--panel2)}
.spd button.pause{color:var(--fg)}
.spd button.pause.on{background:var(--cyan);border-color:var(--cyan);color:var(--bg)}
.now.paused{border-color:var(--cyan)}
.spd button.boost{color:var(--cyan);border-color:var(--cyan-soft)}
.spd button.boost.on{background:var(--cyan);color:var(--bg)}
.spd .bsel{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;padding:2px 4px 2px 9px;border:1px solid var(--cyan-soft);border-radius:4px;color:var(--cyan)}
.spd .bsel.on{background:var(--cyan);color:var(--bg)}
.spd .bsel select{font:inherit;color:inherit;background:transparent;border:0;padding:3px 2px;cursor:pointer}
.spd .bsel select option{color:var(--fg);background:var(--panel)}
.meter{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:8px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px}
.bar.hp i{background:var(--red)}
.bar.xp i{background:var(--cyan)}
.meter span{font-size:12px;color:var(--fg);min-width:92px;text-align:right}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res>div{display:flex;align-items:baseline;gap:6px;background:var(--panel2);border-radius:4px;padding:5px 8px;min-width:0}
.res b{font-size:15px;font-weight:500}
.res .cap{font-size:11px;color:var(--faint);font-weight:400}
.res b.full{color:var(--amber)}
.res>div{flex-wrap:wrap}
.res small.rt{flex-basis:100%;margin-left:0;color:var(--dim);font-size:11px}
.res small.rt.neg{color:var(--red)}
#t-ratt{white-space:normal;overflow-wrap:anywhere}
.foods{flex-basis:100%;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--fg);font-family:var(--f-mono)}
.foods em{font-style:normal;color:var(--dim)}
.foods span.full{color:var(--amber)}
.foods span i{font-style:normal;color:var(--faint)}
.surv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px}
.surv b{font-size:14px;font-weight:500}
.surv span{color:var(--dim)}
.surv em{font-style:normal;color:var(--dim)}
.surv .strain{flex-basis:100%;color:var(--dim)}
.surv .plan{flex-basis:100%;color:var(--cyan)}
.surv .plan.over{color:var(--amber)}
.surv .strain.hi{color:var(--red)}
.task.rest .tm{border-style:dashed}
.task.train .tm{border-style:dotted}
.mn.train .mb{stroke-dasharray:1 3}
.surv.warn b,.surv.warn em{color:var(--red)}
.tx .tt{color:var(--dim)}
.eat{flex-basis:100%;margin-top:4px;font-size:12px;padding:5px 8px;border:1px solid var(--green);color:var(--green);border-radius:4px;text-align:center}
.eat:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.res .fq{display:block;font-size:11px;color:var(--green);font-family:var(--f-mono);font-weight:400;margin-top:2px}
.res small{font-size:11px;margin-left:auto;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)}
.ngp{border-color:var(--cyan-soft)}
.ngp .h2{color:var(--cyan)}
.bld{margin:-6px 0 10px;font-size:11px;color:var(--faint)}
.ngpick{display:grid;gap:8px;margin:10px 0}
.ngpts{margin:10px 0 4px;font-size:13px}
.ngpts b{color:var(--cyan);font-size:15px}
.ngrow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ngrow>div{flex:1;min-width:0;font-size:13px}
.ngrow small{display:block;color:var(--dim);font-size:11.5px}
.ngrow .btn{width:36px;height:34px;padding:0;font-size:16px}
.ngpick .btn{text-align:left}
.ngpick .btn small{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:2px}
.hng{font-family:var(--f-mono);font-size:11px;color:var(--cyan);border:1px solid var(--cyan-soft);border-radius:3px;padding:1px 4px}
.now{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;padding:7px 9px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:34px}
.now .nf{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber-fill)}
.now span{position:relative;min-width:0}
#n-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#n-eta{font-size:12px;color:var(--dim);white-space:nowrap}
.now.idle{border-color:var(--amber);animation:blink 1.6s ease-in-out infinite}
.now.forage{border-color:var(--green)}
@keyframes blink{50%{border-color:var(--line)}}

/* main */
main{padding-block:12px 100px}
main .wrap{display:grid;gap:18px}
.view{display:grid;gap:18px}
.view[hidden]{display:none!important}

/* queue */
.qp{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:6px}
.qh{display:flex;justify-content:space-between;align-items:center}
.qh .qeta{color:var(--cyan);letter-spacing:0;text-transform:none;font-weight:400}
.item h3.gready{color:var(--yellow)}
.tgm{color:var(--cyan)}.te.over,#n-eta.over,#q-eta.over{color:var(--red)}.trl{color:var(--amber)}
.secrun{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;margin:4px 0 8px;border:1px solid var(--cyan-soft);border-radius:4px;font-size:12.5px;color:var(--fg)}
.secrun.on{border-color:var(--cyan)}
.secrun.dim{color:var(--dim)}
.secrun .btn{padding:6px 12px;font-size:12.5px;white-space:nowrap}
.gitem .ta{margin-left:6px}
.chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.chain .cqadd{margin-left:auto;padding:3px 8px;font-size:11.5px}
.chain .lk{color:var(--cyan)} .chain .br{color:var(--faint)}
.chain span.st{padding:2px 6px;border:1px solid var(--line);border-radius:3px}
.chain span.st.ok{border-color:var(--cyan-soft)}
.qnow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid var(--amber);border-radius:4px;font-size:13px}
.qnow .btn{padding:5px 10px;font-size:12px}
.qh button{font-size:12px;color:var(--dim);padding:3px 6px}
.qlist{display:flex;flex-wrap:wrap;gap:6px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.qlist.long{max-height:55vh;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.qrow{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.qrow.blocked{opacity:.6}
.qrow .qn{color:var(--faint);font-family:var(--f-mono);font-size:12px}
.qrow .qt{flex:1;min-width:0}
.qrow.cq{border-color:var(--cyan-soft);align-items:flex-start}
.task.chaincard{border-color:var(--cyan-soft)}
.task.chaincard .tn{color:var(--cyan)}
.task.chaincard .csub{list-style:none;margin:0;padding:6px 12px 10px;display:grid;gap:2px;font-size:12px;color:var(--dim);flex-basis:100%}
.task.chaincard .csub li.done{color:var(--faint);text-decoration:line-through}
.task.chaincard{flex-wrap:wrap}
.copen{font-size:13px}
.qrow.cq .cqt{width:auto;height:auto;border:0;padding:0;color:var(--cyan);font-size:13px;text-align:left}
.qrow .csub{list-style:none;margin:6px 0 2px;padding:0 0 0 4px;display:grid;gap:2px;font-size:12px;color:var(--dim)}
.qrow .csub li.done{color:var(--faint);text-decoration:line-through}
.qrow .csub li.cur{color:var(--fg)}
.qrow small{color:var(--dim);font-size:11px}
.qrow button{width:28px;height:30px;flex:0 0 auto;border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:14px}
.qrow button:disabled{opacity:.3;cursor:default}
.qrow .qdrag{flex:0 0 auto;width:22px;height:30px;margin-left:-4px;display:grid;place-items:center;color:var(--faint);font-size:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.qrow.dragging{position:relative;z-index:5;border-color:var(--amber);background:var(--panel);box-shadow:0 6px 16px rgba(0,0,0,.45);transition:none}
.qlist.dragmode .qrow:not(.dragging){transition:transform .12s ease}
.qlist.dragmode{user-select:none;-webkit-user-select:none}
.qh .qhb button{font-size:12px;color:var(--dim);padding:3px 6px}
.qh .qhb button.qclear{color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12.5px}
.qh .qhb button.qclear:hover{border-color:var(--red);color:var(--red)}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.qmain{min-width:0;display:grid;gap:6px}
.qpre{display:grid;gap:6px;padding-left:10px;border-left:1px dashed var(--line)}
.qps{display:grid;gap:3px;font-size:12px}
.qpl{display:flex;gap:6px;align-items:baseline}
.qpb{display:flex;gap:4px}
.qps b{font-family:var(--f-mono);color:var(--amber)}
.qps small{color:var(--dim);font-size:11px}
.qps button{font-size:11px;padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--fg)}
.qps button:disabled{opacity:.35;cursor:default}
.qkeep p{font-size:12px}
.lockq{visibility:visible!important}
.qchip{font-size:12px;padding:5px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);text-align:left}
.qchip small{color:var(--dim);font-size:11px}
.qchip i{font-style:normal;color:var(--faint);margin-left:6px}
.qchip.blocked{opacity:.55}
.qnote{font-size:12px;color:var(--dim)}
.qnote b{color:var(--fg);font-weight:500}

/* zones and tasks */
.zone{display:grid;gap:6px}
.zh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:5px}
.zh h2{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.zh span{font-size:12px;color:var(--dim)}
.zh em{margin-left:auto;font-style:normal;font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.sub{font-family:var(--f-disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.task{display:flex;gap:6px;align-items:stretch}
.tm{position:relative;flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:5px;padding:9px 10px;overflow:hidden;background:var(--panel)}
.tm .tf{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber-soft);pointer-events:none}
.tm>div{position:relative}
.th{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tn{font-weight:500;font-size:14.5px;min-width:0}
.te{font-size:12px;color:var(--dim);white-space:nowrap}
.tx{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:5px;align-items:center;font-size:12px;color:var(--dim)}
.chip{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border-radius:3px;border:1px solid currentColor;line-height:1.5}
.c-eng{color:var(--amber)} .c-bio{color:var(--green)} .c-cbt{color:var(--red)} .c-hak{color:var(--violet)} .c-nav{color:var(--cyan)} .c-res{color:var(--sand)}
.haz{color:var(--red)}
.star{color:var(--amber)}
.task.job .tm{background:var(--panel2)}
.task.on .tm{border-color:var(--amber)}
.task.job .tm .tf{background:var(--amber-soft)}
.task.job:not(.on) .tm .tf{opacity:.45}
.tf.fast,.nf.fast{width:100%!important;opacity:.75;background:linear-gradient(90deg,var(--amber-soft),var(--amber-fill),var(--amber-soft))!important}
.task.fb .tn::after{content:" · fallback";color:var(--faint);font-size:11px;font-weight:400}
.tq{flex:0 0 44px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:18px;color:var(--dim)}
.side{display:flex;flex-direction:column;gap:4px;flex:0 0 52px}
.side .tq{flex:1 1 auto;min-height:36px}
.ta{flex:0 0 52px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);padding:6px 0}
.side .ta{flex:0 0 auto}
.ta.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.tp{border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);padding:5px 0}
.tp.open{border-color:var(--amber);color:var(--amber)}
.prio{display:grid;gap:8px;padding:10px;margin-top:-2px;border:1px solid var(--amber);border-radius:5px;background:var(--panel2);font-size:12px;color:var(--dim)}
.prio b{color:var(--fg);font-weight:500}
.prio-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.prio-btns button{font-family:var(--f-mono);font-size:14px;padding:8px 0;border:1px solid var(--line);border-radius:4px;color:var(--fg)}
.prio-btns button.on{background:var(--amber);border-color:var(--amber);color:var(--bg)}
.tq.in{color:var(--amber);border-color:var(--amber);font-size:12px}
.task.lock .tm{opacity:.45;cursor:default;border-style:dashed}
.task.lock .tq{visibility:hidden}

/* skills */
.sk.fam h3{font-family:var(--f-body);font-size:14px;text-transform:none;letter-spacing:0;font-weight:500}
.sk{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}
.skh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.skh h3{margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.skh b{font-family:var(--f-mono);font-size:16px;font-weight:500}
.skm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.note{font-size:13px;color:var(--dim);max-width:62ch;margin:0}
.panel{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:4px;background:var(--panel)}
.h2{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* gear */
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item>div{flex:1;min-width:0}
.item h3{margin:0;font-size:14.5px;font-weight:500}
.item p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.buy{font-family:var(--f-mono);font-size:12px;padding:8px 10px;border-radius:4px;border:1px solid var(--amber);color:var(--amber);white-space:nowrap;min-width:84px}
.tq small{display:block;font-size:10px;line-height:1;opacity:.8}
.gqb{flex:0 0 auto;width:40px;height:40px;margin-left:6px}
.item.lockd h3{color:var(--dim)}
.buy:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.owned{font-family:var(--f-mono);font-size:12px;color:var(--green);min-width:84px;text-align:center}

/* archive */
.perk{padding:9px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.perk h3{margin:0;font-size:14px;font-weight:500;color:var(--amber)}
.perk p{margin:0;font-size:12px;color:var(--dim)}
.perk .by{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.perk.no h3{color:var(--faint)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--panel2);border-radius:4px;padding:8px}
.stats b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px}
.stats span{font-size:11px;color:var(--dim)}
.set{display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row p{margin:0;font-size:13px}
.row small{display:block;color:var(--dim);font-size:12px}
.tog{width:46px;height:26px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .15s}
.tog.on{background:var(--amber-fill);border-color:var(--amber)}
.tog.on::after{transform:translateX(20px);background:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber)}
.btn{font-size:13px;padding:9px 12px;border-radius:5px;border:1px solid var(--line);color:var(--fg)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:600}

/* log */
.le{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}
.le header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.le h3{margin:0;font-size:14px;font-weight:500}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .wrap{display:flex;justify-content:space-between;gap:2px;overflow-x:auto;scrollbar-width:none}
#tabs .wrap button{flex:0 0 auto;padding-left:3px;padding-right:3px}

#tabs button.dot::after{content:"";position:absolute;top:9px;right:18%;width:6px;height:6px;border-radius:50%;background:var(--cyan)}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,9,12,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;max-width:440px;width:100%;max-height:100%;overflow:auto;display:grid;gap:12px}
.mbox h2{margin:0;font-family:var(--f-disp);font-size:26px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--amber);line-height:1.1;text-wrap:balance}

.mbox ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px;color:var(--dim)}

.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt td{padding:4px 0;border-bottom:1px solid var(--line)}
.dt td:not(:first-child){text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--cyan)}
#toasts{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:15;display:grid;justify-items:center;gap:6px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 12px;font-size:13px;max-width:420px;animation:tin .2s ease-out}

@keyframes tin{from{transform:translateY(8px);opacity:0}}
.fld{display:grid;gap:4px}

  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;box-sizing:border-box}

<script id="logic">
/* ===== Game data and rules (no DOM) ===== */
const BUILD = '2026-11-03 · packed shared saves';   // shown in the main menu, to tell which version is loaded
const DPS = 8;             // simulation ticks per real second at 1x (doubled for the test version: same balance, half the real time)
// Time is simulated in ticks. 80 ticks make one ship day (18 minutes each), so a day lasts
// 20 real seconds at 1x and a clone lives weeks, not years. Everything is shown in days and hours.
const TPD = 80;
const JOB_CYCLE = 8;       // in-game days of base work per job batch
const MEAL_CD = 40;        // ticks between meals: one ration every 12 hours, 2 a day
const EAT = 1 / MEAL_CD;   // average rations eaten per tick (used for estimates)
const HUNGER = 0.15;       // base health lost per tick, always, while time runs
// Strain: the body wears down. The hunger drain is multiplied by strain, which climbs
// faster and faster as the clone ages: its growth rate starts at +1 per STRAIN_RAMP ticks and
// rises by that much again every STRAIN_ACCEL ticks of wear. Rest actions halve strain but not wear, so the acceleration keeps building.
const STRAIN_RAMP = 1250, STRAIN_ACCEL = 300;
// Automated rests fire at this strain (player setting in the Auto tab, default 2.5)
const restAt = () => (S && S.set && S.set.restAt) || 2.5;
// Resolve slows strain: early clones feel it most.
const STRAIN_RES = 0.002;
// Late wear: after a couple of weeks the growth rate climbs much faster (squared term), which keeps
// well-fed late clones to roughly a month.
const STRAIN_LATE = 540;
const strainRate = wear => (1 + wear / STRAIN_ACCEL + Math.pow(wear / STRAIN_LATE, 2)) / STRAIN_RAMP / (1 + STRAIN_RES * (S.life.lv.res || 0)) * (M ? M.strainMul : 1) * (M ? M.a2strain : 1);   // Honours (Long-watch rhythm) work in both acts
const MAX_DRAIN = 1.2;     // most health a clone can lose per day: a full bar lasts at least ~1 min at 1x
// A meal restores the hunger of one cooldown plus the old resting regeneration.
// Food deeper in the ship is better: each section past the first makes meals restore 12% more.
const MEAL_SEC = 0;
// Food: one ration store until the long watch. Every food job fills it. How much a ration heals
// depends on the best kitchen this clone has fixed: each section has one upgrade action (see MEAL_UP),
// done again every life. The store grows as the clone gets deeper into the ship (STORE_CAP), plus gear.
// In the long watch the repaired ship grows three extra foods (fresh harvest, colony seed stock, cultured protein). Each has
// its own small store and its own meal timer, so carrying them means extra meals.
const FOODS = [
  {id:'ration',  z:1,  name:'Rations',           q:1,   cap:6,  job:null},
  {id:'harvest', z:9,  name:'Fresh harvest',     q:2.4, cap:24, job:'beds'},
  {id:'seed',    z:10, name:'Colony seed stock', q:2.8, cap:28, job:'stores'},
  {id:'protein', z:11, name:'Cultured protein',  q:3.4, cap:28, job:'meatvats'},
];
const FD = {}; FOODS.forEach(f => FD[f.id] = f);
const FOOD_OF = {}; for (let z = 1; z <= 11; z++) FOOD_OF[z] = 'ration';
const STORE_CAP = {1:6, 2:20, 3:36, 4:60, 5:90, 6:110, 7:125, 8:135, 9:110, 10:125, 11:135};
// The section upgrade actions and the ration strength each one brings (kept for the rest of the life)
const MEAL_UP = {heatpaste:1.27, strains:1.54, packer:1.85, ovens:2.17, pantryfix:2.48, mess:2.55, synthfix:2.62, hivegel:2.7, graft:2.8, sprout:3.07, feast:3.34};
function mealTier(){ const L = S && S.life; let q = 1; if (L) for (const id in MEAL_UP) if (L.done && L.done[id]) q = Math.max(q, MEAL_UP[id]); return q; }
const jobFood = t => !(t && t.prod && t.prod.rations) ? null : (FOODS.find(f => f.job === t.id) || FD.ration).id;
// Meal pace: every meal heals the same; better food and kitchens make the meal timer shorter (12 h / pace)
function foodQ(f){ f = f || 'ration'; return (f === 'ration' ? mealTier() : FD[f].q) * ((M && M.fq && M.fq[f]) || 1) * ((M && M.pace) || 1) * ((M && M.a2food) || 1); }   // Honours (Field rations) work in both acts
function syncFood(){ const L = S.life; L.rations = FOODS.reduce((a, f) => a + Math.max(0, L.food[f.id] || 0), 0); }
function addFood(f, a){
  const L = S.life; if (a <= 0) return; f = f || 'ration';
  L.food[f] = (L.food[f] || 0) + a; syncFood();
}
// Any food left at all (a whole portion)? Without it the clone starves.
const FOOD_MIN = 0.01;   // a crumb: any food at all left
const EAT_GAP = 0.5;     // health missing before the clone bothers to eat
function nextFood(){ const L = S.life; const f = FOODS.slice().reverse().find(f => (L.food[f.id] || 0) >= 1); return f ? f.id : null; }
// One meal of each kind per its own timer: 12 h, shortened by the food's pace
function mealCd(f){ return MEAL_CD / foodQ(f); }
// Foods ready to eat now (stocked and off their own cooldown), best first
function readyFoods(){ const L = S.life; return FOODS.filter(f => (L.food[f.id] || 0) >= 1 && ((L.mcd || {})[f.id] || 0) <= 0).sort((a, b) => foodQ(b.id) - foodQ(a.id)).map(f => f.id); }
// Food eaten per tick, for estimates: meals only cover what health needs, best food first, each kind
// at most one meal per cooldown
function eatRate(){
  const L = S.life, cur = L.cur ? T[L.cur] : null;
  let need = Math.min(HUNGER * (L.strain || 1) + (cur && cur.haz ? hazDmg(cur) : 0), MAX_DRAIN) / drainDiv(), units = 0;
  FOODS.slice().sort((a, b) => foodQ(b.id) - foodQ(a.id)).forEach(f => {
    if ((L.food[f.id] || 0) < FOOD_MIN || need <= 0) return;
    const mh = mealHp(f.id), take = Math.min(need, mh / mealCd(f.id)); units += take / mh; need -= take;
  });
  return units;
}
// Time until the next meal is possible
function nextMealIn(){ const L = S.life; let m = Infinity; FOODS.forEach(f => { if ((L.food[f.id] || 0) >= 1) m = Math.min(m, (L.mcd || {})[f.id] || 0); }); return m; }
const foodsInPlay = () => FOODS.filter(f => f.z === 1 || isWatch(S.life.sec || 1) || (S.life.food[f.id] || 0) > 0.005);
const MEAL_MULT = 1.58;   // meals restore more than one meal-gap of hunger, to push back against strain
function mealHp(f){ return (HUNGER + MEAL_REGEN) * MEAL_CD * MEAL_MULT; }   // the same for every meal
const MEAL_REGEN = 0.05;
const START_AGE = 14;

const SKILLS = [
  {id:'eng', name:'Engineering', ab:'ENG'},
  {id:'bio', name:'Biotech',     ab:'BIO'},
  {id:'cbt', name:'Combat',      ab:'CBT'},
  {id:'hak', name:'Hacking',     ab:'HAK'},
  {id:'nav', name:'Navigation',  ab:'NAV'},
  {id:'res', name:'Endurance',   ab:'END'},
];
const SKN = {}; SKILLS.forEach(s => SKN[s.id] = s);

// Sections. Act I runs 1-5 in a line; a run may then go into one Act II branch (see pathOf).
const ZONES = [
  {id:1, name:'Vat Bay',            sub:'Deck 9 · clone stock',          tier:1},

/* ----- map: every action ever performed, by section, wired by requirement ----- */
let mapKey = '', mapRefs = [];
const MW = 340, NH = 50, RG = 34, PAD = 8;
function wrap2(txt, max){
  const w = txt.split(' '), lines = ['']; 
  w.forEach(x => { const l = lines[lines.length - 1]; if ((l + ' ' + x).trim().length > max && lines.length < 2 && l) lines.push(x); else lines[lines.length - 1] = (l + ' ' + x).trim(); });
  if (lines[1] && lines[1].length > max) lines[1] = lines[1].slice(0, max - 1) + '…';
  return lines;
}
function renderMap(){
  const ever = S.ever || {};
  const key = Object.keys(ever).join() + '|' + S.gen;
  if (key === mapKey) return; mapKey = key;
  let h = '<div class="panel"><span class="h2">Ship map</span><p class="note">Every action your clones have ever performed, by section. Lines show what each one needs. Filled boxes are done in this life; the glowing one is in progress. Tap an action to work on it.</p></div>';
  let any = false;
  ZONES.forEach(z => {
    const nodes = TASKS.filter(t => t.kind !== 'job' && t.z === z.id && ever[t.id]);
    if (!nodes.length) return;
    any = true;
    const ids = new Set(nodes.map(t => t.id)), depth = {};
    const dOf = t => { if (depth[t.id] != null) return depth[t.id]; let d = 0; t.req.forEach(r => { if (ids.has(r)) d = Math.max(d, dOf(T[r]) + 1); }); return depth[t.id] = d; };
    nodes.forEach(dOf);
    const rows = [];
    nodes.forEach(t => (rows[depth[t.id]] = rows[depth[t.id]] || []).push(t));
    const pos = {};
    rows.forEach((row, ri) => {
      const n = row.length, gap = 8, w = (MW - PAD * 2 - gap * (n - 1)) / n;
      row.forEach((t, i) => pos[t.id] = {x: PAD + i * (w + gap), y: PAD + ri * (NH + RG), w});
    });
    const H = PAD * 2 + rows.length * NH + (rows.length - 1) * RG;
    let edges = '', boxes = '';
    nodes.forEach(t => {
      const p = pos[t.id];
      t.req.forEach(r => { if (!pos[r]) return; const q = pos[r];
        const x1 = q.x + q.w / 2, y1 = q.y + NH, x2 = p.x + p.w / 2, y2 = p.y, my = (y1 + y2) / 2;
        edges += `<path class="me" data-from="${r}" d="M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`; });
      const lines = wrap2(t.name, Math.max(10, Math.floor(p.w / 6.6)));
      const outside = t.req.filter(r => !ids.has(r) && T[r] && T[r].z !== z.id);
      boxes += `<g class="mn${t.kind === 'rest' ? ' rest' : t.kind === 'train' ? ' train' : ''}" data-mapdo="${t.id}" transform="translate(${p.x} ${p.y})">
        <rect class="mb" width="${p.w}" height="${NH}" rx="5"/>
        <rect class="mf" width="0" height="${NH}" rx="5"/>
        ${lines.map((l, i) => `<text x="8" y="${(lines.length === 1 ? 23 : 17) + i * 14}">${esc(l)}</text>`).join('')}
        <text class="ms" x="8" y="${NH - 7}"></text>
        ${outside.length ? `<title>Needs ${esc(outside.map(r => T[r].name).join(', '))}</title>` : ''}
      </g>`;
    });
    const entry = [...new Set(nodes.flatMap(t => t.req.filter(r => T[r] && T[r].z !== z.id)))].map(r => T[r].name);
    h += `<section class="zone"><header class="zh"><h2>${z.name}</h2><span>${z.sub}</span></header>
      ${entry.length ? `<p class="note">Reached from: ${esc(entry.join(', '))}</p>` : ''}
      <div class="mapwrap"><svg viewBox="0 0 ${MW} ${H}" width="100%" role="img" aria-label="Map of ${esc(z.name)}">${edges}${boxes}</svg></div></section>`;
  });
  if (!any) h += '<p class="note">Nothing mapped yet. Finish your first action to start the map.</p>';

/* ----- FAQ ----- */
const FAQ_ALL = [
  ['What is the goal?', 'Restore the ship so WARDEN can wake the sleeping crew: the food system in the Hydroponics Ring, the energy system in the Engineering Spine and the stardrive in the Main Drive. The game ends when you ignite the drive. One clone cannot do it all; it takes many lives (around 50 with very good play).'],
  ['How do I start?', 'Tap a task to work on it right away. Climb out of the vat first, then press vat algae for food and strip wall panels for salvage. Time only moves while your clone is working: with nothing to do, the clock stops, so you can always read and plan.'],
  ['What are jobs, actions, training and rests?', '<b>Jobs</b> repeat and make food or salvage in batches; they stop when that storage is full. <b>Actions</b> are one-off tasks that unlock things and move the story on. Each needs certain earlier actions, and a section\u2019s last action (its crossing) needs every other action of that section. Tasks you have met before stay listed, greyed out, until what they need is done; you can still queue them. <b>Drills</b> each add a little familiarity to every task in their section, up to 4 sessions per life. <b>Rests</b> halve strain; each section has one, usable once per life.'],
  ['How does the queue work?', 'Tapping a task runs it right away, ahead of the queue (a job runs until its store is full); it is not added to the queue. <b>+</b> adds a task to the end of the queue; drag it or use the arrows to move it up. You can queue the same task several times at different places: tap + again for another copy. A task queued once runs until it is done; with several copies, each copy covers one repetition (one training session, one rep, or one fill of a store). The queue holds up to 100 items. Drag an item by the handle on its left to move it, or use the arrows; ✕ removes it. Queued jobs run until their storage is full. You can queue things you have seen before even if they are not available yet; they wait their turn. Gear can be queued too, with the <b>+</b> on its card (gear is listed in each section of the Tasks tab): the clone works the best salvage job until it can afford the design, then builds it. Five presets save and load whole queues, and <b>Keep queue between clones</b> gives each new clone the queue you planned, minus anything that is automated and switched on.'],
  ['Food and health', 'Health drains all the time and meals put it back. <b>Every meal heals the same amount</b>; what changes is how often the clone can eat. All food goes into one <b>ration store</b>: every food job fills it, and the store grows as the clone gets deeper into the ship (6 in the Vat Bay, up to 90 in the Main Drive), plus gear and records. A ration can be eaten every 12 hours at first. Each section has one <b>kitchen upgrade</b> action (heat the algae paste, splice richer strains, refit the ration packer, restart the galley ovens, reseal the pantry, and one in each Act II section) that shortens the wait between rations for the rest of that life, down to under 5 hours; each clone has to fix them again. Meals are always whole portions, and the clone only eats when it needs to: when a whole meal fits under full health, or sooner once health is down to half. At full health no food is used. In the <b>long watch</b> the repaired ship grows three extra foods: <b>fresh harvest</b> from the regrown beds (The Cruise), <b>colony seed stock</b> (The Drift) and <b>cultured protein</b>, meat grown in tanks (Tessaly Orbit). Each has its own store and its own, shorter meal timer, so a clone carrying them eats extra meals. With no food left at all you starve. The Hydroponics Ring has no food job until you restore its irrigation pumps, so arrive stocked.'],
  ['What is strain?', 'Strain multiplies the health drain. It grows faster and faster the longer a clone lives, which is what eventually kills every clone. Rests halve it; good food heals faster than strain can drain early on. Watch <b>Time left</b> at the top: it says how long the clone will last and what will kill it.'],
  ['What carries over when a clone dies?', '<b>Familiarity</b> is kept: every task stays as fast as your clones have made it (see the Speed tab). Each day a clone survives adds 0.8 to the base health of later clones, up to 500. <b>Archive records</b> found by finishing certain actions are permanent upgrades. Gear, rations, salvage and progress through the ship reset.'],
  ['What are sections?', 'The ship is split into five sections. A <b>red</b> action leads to the next one, and the way back is sealed for that clone, so finish what you need first (records, the rest, training, gear). Each new clone starts back in the Vat Bay.'],
  ['What is gear?', 'Gear is built from salvage and lasts for one clone. Each section has designs to build. Building one pays its salvage up front, then the clone spends time <b>assembling</b> it (bigger designs take longer, from minutes for a toolkit to a few days for the largest); assembly comes before other work and gets faster with familiarity. The gear works once it is assembled. Salvage storage is limited; opening up more of the ship raises it.'],
  ['What is familiarity?', 'There are no skills: each task gets faster on its own the more of it your clones have done. Familiarity counts work in completions, including attempts a clone died in the middle of, and is kept between clones. Speed rises smoothly from ×1 to ×10 once you have done enough of a task: in a first run, 90 lives’ worth of it (90 finishes of an action, 1800 batches of a job). Each level of the Act I reward <b>Deep echo</b> lowers that for Act I tasks by about 30%. Familiar tasks also hurt less (hazard damage up to ÷4), and a familiar food job lets its food be eaten more often. <b>Drills</b> spread familiarity to every task in their section. The Speed tab lists every task.'],
  ['How does automation work?', 'Every completion counts: finish an action 10 times (a multi-rep action 10 times its reps), a training session 40 times or a rest 10 times, work a job for 200 batches, or build a design in 10 lives, and its automation <b>switches on by itself</b>. For Act I tasks these counts shrink along with the familiarity threshold (Deep echo), never below one; tap <b>AUTO</b> (or its switch in the Auto tab) to turn it off, and it stays off. Automated tasks run by themselves <b>ahead of your queue</b>, in chain order (each after the tasks it needs). Automated tasks <b>link into chains</b> when one requires the other and both are at least ×2 familiar. When every action, crossing, job and rest of a section is automated and ×5 familiar, and all its gear designs are automated, the whole section becomes <b>one chain</b>: press <b>▶ Run section</b> (top of the section in the Tasks tab) and the clone works through everything, builds the gear, fills its stores and crosses. Ready sections next to each other link across their crossings into one run (<b>▶ Run 3 sections</b>), up to the end of the act; a run that dies starts again with the next clone. The option <b>Pause when a section run ends instead</b> keeps a run going through its crossings and pauses once it is over. A chain picks its next step itself each time: gear first, then kitchen upgrades, then the actions and drills in the order they depend on each other, then rests and storage-filling jobs, and the crossing last. When a chain forms or grows, it <b>queues itself</b>, including the chains of sections still ahead, and chain entries are kept in the order they will run: section by section, and within a section the chain that starts earliest first, with the crossing\u2019s chain last, and anything of it you had queued separately is dropped from the queue. If you remove a chain from the queue, it stays out for the rest of that clone\u2019s life. Work done as part of a chain (a queued chain or a section run) builds <b>chain flow</b>, which makes chained steps up to five times as fast; it is kept for good. An automated food job steps in when its store drops below the forage threshold and fills it up. An automated <b>salvage</b> job only gathers what gear needs: the next auto-built or queued design that is found and not built yet; it does not top the store up to full (except while filling up before a crossing). Automated <b>crossings</b> are the exception: they wait until your queue is done. A task you tap runs before everything. The <b>Auto</b> tab lists everything unlocked and has extra options: feeding when needed, filling storage before moving on, the strain level for automatic rests, the death screen and starting paused.'],
  ['What happens at a crossing with automation?', 'A queued or automated crossing stops just before it finishes and waits while the clone finishes automated actions and training, builds affordable automated gear, refills storage (if that option is on) and uses the section’s rest. Tap a crossing yourself to go at once.'],
  ['Pause, background and boost', 'Pause with the button at the top or the space bar. The game keeps running in a background tab and catches up when you return, then shows what happened while you were away. Time while the game is fully closed is banked as a <b>stasis boost</b> you can switch on in the header. Pick Off, ×2, ×5 or ×10 from its menu: at ×5 every real second plays five, and the bank pays for the extra four, so faster boost spends the bank faster. Both start capped at 8 hours: at most 8 hours of background time is played out, and the boost holds at most 8 hours. Each <b>Stasis watch</b> record adds 8 hours to both; you get one the first time you finish each section (5 in all, up to 48 hours).'],
  ['Saves', 'The game saves itself every few seconds on this device, in three slots (☰ menu). Use <b>Save files and transfer</b> in the menu to export a save file, import one, or copy the save as text to move it between devices.'],
  ['Settings', 'The ⚙ button opens sound (music and effects), layout (vertical or horizontal) and, in the Android app, app updates. Gameplay options such as auto-eat and the forage threshold are in the Archive tab.'],
];
// Shown once the drive is first lit.
const FAQ_NGP = ['Act I rewards', 'There is no restarting: after the drive is lit, the story always moves forward into Act II. Moving forward earns <b>Act I reward points</b>: one for lighting the drive, one for each Act II section you first reach and two for each Act II branch you finish (11 in all). Spend them in the Archive; each level costs one point and is permanent. <b>Deep echo</b> (Act I tasks need about 30% less familiarity per step for \u00d710), <b>Drain dampener</b> (health drain in Act I divided by 2.3, 3.7, then 5) and <b>Template upgrade</b> (+167, +333, then +500 max health in Act I) work fully in Act I, which every clone crosses on its way, and at 10% strength in Act II. <b>Overclocked line</b> makes the whole game run faster in both acts (\u00d72.3, \u00d73.7, then \u00d75) without using banked time. Each reward has three levels, so 11 points can\u2019t max everything: choose. Lighting the drive the first time also unlocks the <b>Quartermaster\u2019s cache</b>: every clone starts with all of its automated gear already built, in both acts.'];
const FAQ_A2 = ['Act II', 'Once the main drive is lit, every clone that lights it carries on into <b>Act II</b>, which runs in order: first <b>the boarders</b> (alien boarders cut into the hull; three sections of fighting, ending on their ship), then <b>the long watch</b> (the voyage goes on; the ship slowly wears out, which adds to the health drain until upkeep jobs bring it down; three sections to Tessaly orbit). Act II tasks have their own familiarity, which Deep echo reduces only at 10% strength: it starts at 90 lives\u2019 worth for \u00d710 and drops by a quarter once the boarders are beaten, and again after the long watch. Act II familiarity, automation, records and <b>Honours</b> are kept for good. Honours (one per Act II section first reached, two each for beating the boarders and finishing the long watch: 10 in all) buy rewards in the Archive that work in <b>both acts</b>: Veteran template (hazard damage \u221225% per level), Long-watch rhythm (strain \u221213%), Scavenger\u2019s eye (salvage from jobs +33%) and Field rations (meals 17% more often). Like Act I rewards they have three levels each, and spending is permanent.'];
let faqDone = '';
function renderFaq(){
  const k = String(!!(S.won || (S.pr && S.pr.n))) + !!(S.a2 && S.a2.open);
  if (faqDone === k) return; faqDone = k;
  const FAQ = FAQ_ALL.concat(S.won || ngpPts() > 0 ? [FAQ_NGP] : [], S.a2 && S.a2.open ? [FAQ_A2] : []);
  $('#v-faq').innerHTML = '<div class="panel"><span class="h2">FAQ</span><p class="note">How Long Patience works. Tap a question to open it.</p></div><div class="faq">' +
    FAQ.map(([q, a], i) => `<details${i < 2 ? ' open' : ''}><summary>${q}</summary><p>${a}</p></details>`).join('') + '</div>';
}

/* ----- modals ----- */
function showModal(h){ $('#mbox').innerHTML = h; $('#modal').hidden = false; }
function hideModal(){ $('#modal').hidden = true; }
function showIntro(){
  paused = true;
  showModal(`<h2>Long Patience</h2>
    <p>You are K-7, a disposable maintenance clone aboard the colony ship <b>Long Patience</b>. Its 3,112 crew sleep in stasis. WARDEN, the ship\u2019s overseer, wakes clones like you to do the work nobody else will: repair the <b>food system</b>, the <b>energy system</b> and the <b>stardrive</b>, so the crew can be woken.</p>
    <p class="d">Each body lasts days, not years. When it fails, WARDEN decants another. What you learn echoes into the next one.</p>
    <p class="faqwarn"><b>New to the game?</b> Read the <b>FAQ</b> tab first. It explains tasks, food, strain, sections, automation and saves.</p>
    <button class="btn pri" data-close>Begin the work cycle</button>`);
}
function showDeath(){
  const L = S.life;
  const age = L.day / TPD;
  const gains = TASKS.map(t => ({t, a:L.fam0 ? masteryFracOf(t, L.fam0[t.id] || 0) : 0, b:masteryFrac(t)})).filter(x => x.b - x.a > 0.001)
    .sort((x, y) => (y.b - y.a) - (x.b - x.a)).slice(0, 6);
  let rows = gains.map(x => `<tr><td>${esc(x.t.name)}</td><td><span class="up">\u00d7${fmt(masteryF(x.t))} (+${fmt(9 * (x.b - x.a))})</span></td></tr>`).join('');
  showModal(`<h2>Clone ${S.gen} terminated</h2>
    <p>${esc(L.cause)}.</p><p class="d">Lived ${age.toFixed(1)} days · ${L.order.length} actions completed</p>
    <p class="d">Hardened genome: <span class="up">+${fmt(L.vitGain || 0)} max health</span> for every future clone (base now ${Math.min(BASE_HP_MAX, 100 + Math.floor(S.vit || 0))}${100 + Math.floor(S.vit || 0) >= BASE_HP_MAX ? ', the maximum' : ''}).</p>
    <table class="dt">${rows}</table>
    ${S.perks.engram && S.engramT && T[S.engramT.id] ? '<p class="d">Engram recorder: the next clone starts \u201c' + T[S.engramT.id].name + '\u201d ' + Math.round(Math.min(S.engramT.p, ENGRAM_SHARE * T[S.engramT.id].days) / T[S.engramT.id].days * 100) + '% done.</p>' : ''}
    <button class="btn pri" data-decant>Decant clone ${S.gen + 1}</button>`);
}
function showWin(){
  paused = true;
  showModal(`<h2>The drive is lit</h2>
    <p>The food beds grow, the reactor holds and the stardrive burns for Tessaly. It took ${S.gen} clone${S.gen > 1 ? 's' : ''} of K-7 to get here. None of them will be remembered.</p>
    <p>WARDEN begins the wake cycle, then stops. Proximity alarms. Something is closing on the ship.</p>
    <p class="d"><b>Act II</b> begins: the boarders first, then the long watch. Every clone that lights the drive carries on into it. Lighting the drive earned an <b>Act I reward point</b> (spend it in the Archive), and the <b>Quartermaster\u2019s cache</b> is unlocked: from now on clones start with their automated gear.</p>
    <button class="btn pri" data-close>Continue</button>`);
}
// Pick this run's Act II branch; a clone standing at the lit drive goes straight in
function chooseBranch(b){
  if (S.branch) return;
  S.branch = b; S.merge = b === 'B' ? null : S.merge;
  const L = S.life;
  if (!L.dead && L.sec === 5 && complete(T.ignite)) enterZone(b === 'A' ? 6 : 9, 5);
  toast('Act II: ' + (b === 'A' ? 'Boarders' : 'The long watch') + '. Every clone that lights the drive carries on into it.', true);
}
function showMerge(){
  paused = true;
  showModal(`<h2>The hive ship is gone</h2>
    <p>The boarders are repelled. The Long Patience flies on, scarred, with three thousand people still asleep and a long way still to go.</p>
    <div class="ngpick">
      <button class="btn" data-merge="1">Merge into the long watch<small>Carry on into The Cruise: this run (and every clone that gets this far) continues with the long watch.</small></button>
      <button class="btn" data-merge="0">Stop here<small>The boarders were the end of this run. You can still change your mind in the Archive.</small></button>
    </div>`);
}

/* ----- input ----- */
const confirmT = {};
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  audioStart(); sfx(b.classList.contains('tog') || b.classList.contains('ta') ? 'toggle' : b.dataset.buy ? 'buy' : 'click');
  const L = S.life, d = b.dataset;
  if (d.tab) return setTab(d.tab);
  if (d.speed) { S.set.speed = +d.speed; S.set.paused = false; renderSpeed(); return; }
  if ('pause' in d) { togglePause(); return; }

  if (false) { const i = BOOST_RATES.indexOf(boostX()); S.set.boostX = BOOST_RATES[(i + 1) % BOOST_RATES.length]; toast('Stasis boost speed: \u00d7' + S.set.boostX + '. Banked time lasts ' + fmtSecs(S.bank / (S.set.boostX - 1)) + ' at this speed.'); renderSpeed(); return; }
  if ('skiphold' in d) { skipHold(); taskKey = ''; toast('Crossing now.'); renderView(); return; }
  if ('histall' in d) { histAll = !histAll; logKey = ''; renderView(); return; }
  if ('awayundo' in d) {
    if (awayState) {
      S = mergeState(JSON.parse(awayState)); M = mods(); resetViews(); pendingDecant = false;
      // The discarded time becomes stasis boost: exactly the time the tab was hidden (not the time this screen was open).
      const before = S.bank || 0;
      S.bank = Math.min(before + awayGone, awayMax());
      const added = S.bank - before;
      last = performance.now(); save();
      toast('Back to where you left off. +' + fmtSecs(added) + ' added to the stasis boost (now ' + fmtSecs(S.bank) + ')' + (added < awayGone - 1 ? '; the boost is full at ' + fmtSecs(awayMax()) + '.' : '.'));
    }
    awayState = null; hideModal(); paused = false; setTab(tab); return;
  }
  if ('awayok' in d) { awayState = null; hideModal(); paused = false; if (S.life.dead && S.set.deathScreen !== false) showDeath(); return; }
  if ('close' in d) { hideModal(); paused = false; S.intro = true; save(); return; }
  if ('decant' in d) { decant(); if (S.set.deathPause !== false) S.set.paused = true; hideModal(); taskKey = ''; setTab('tasks'); save(); return; }
  if (d.settings) { save(); showSettings(d.settings); return; }
  if (d.saves) {
    save(); settingsFrom = d.saves; paused = true;
    showModal(`<h2>Save files</h2><p class="d">Your game saves on this device by itself. Use these to back it up or move it to another device.</p>${savePanel().replace(/panel set/g, 'panel set mpanel')}
      <button class="btn pri" data-settingsclose>${d.saves === 'menu' ? 'Back to menu' : 'Close'}</button>`);
    return;
  }
  if ('settingsclose' in d) {
    const from = settingsFrom; settingsFrom = null;
    if (from === 'menu') return showMenu();
    hideModal(); paused = false; if (S.life.dead) showDeath(); return;
  }
  if (d.upd) { UPD[d.upd] = !UPD[d.upd]; updSave(); b.classList.toggle('on', UPD[d.upd]); b.setAttribute('aria-pressed', UPD[d.upd]); return; }
  if ('updcheck' in d) { checkAppUpdate(true); return; }
  if ('updinstall' in d) { startAppUpdate(); return; }
  if (d.menu) {
    if (d.menu === 'open') { save(); return showMenu(); }
    if (d.menu === 'back') return showMenu();
    if (d.menu === 'new') return showMenu('new');
    if (d.menu === 'continue') return startGame();
  }
  if (d.newin) {
    const i = +d.newin;
    if (d.used === '1' && !twoStep(b, 'new' + i, 'Tap again to overwrite')) return;
    save();
    slot = i; S = defaultState(); M = mods(); S.life.hp = M.maxHp; resetViews(); save();
    toast('New game in slot ' + i);
    return startGame();
  }
  if (d.loadslot) {
    const i = +d.loadslot, r = readSlot(i); if (!r) return;
    save(); slot = i; S = mergeState(r); M = mods(); resetViews(); save();
    toast('Loaded slot ' + i);
    return startGame();
  }
  if (d.saveto) {
    const i = +d.saveto;
    if (readSlot(i) && !twoStep(b, 'save' + i, 'Tap again to overwrite')) return;
    save();
    try { localStorage.setItem(slotKey(i), JSON.stringify(S)); toast('Saved to slot ' + i); } catch(e) { toast('Couldn\u2019t save: browser storage is full or blocked.'); }
    return showMenu();
  }
  if (d.delslot) {
    const i = +d.delslot;
    if (!twoStep(b, 'del' + i, 'Tap again to delete')) return;
    try { localStorage.removeItem(slotKey(i)); } catch(e) {}
    toast('Slot ' + i + ' deleted');
    return showMenu();
  }
  if (d.layout) { setLayout(d.layout); return; }
  if ('flip' in d) { setLayout(isHoriz() ? 'vertical' : 'horizontal'); toast(isHoriz() ? 'Horizontal layout' : 'Vertical layout'); return; }
  if (d.atog) {
    ASET[d.atog] = !ASET[d.atog]; asave(); audioVolumes();
    document.querySelectorAll(`[data-atog="${d.atog}"]`).forEach(x => { x.classList.toggle('on', ASET[d.atog]); x.setAttribute('aria-pressed', ASET[d.atog]); });
    renderSpeed(); return;
  }
  if ('eat' in d) { const f = readyFoods()[0], h0 = L.hp; if (f && eat(f)) sfx('eat'), toast('Ate ' + FD[f].name.toLowerCase() + '. +' + fmt(L.hp - h0) + ' health'); return; }
  if ('exportjson' in d) { exportJson(); return; }
  if ('ghshare' in d) { shareToGitHub(); return; }
  if ('ghlist' in d) { ghRefresh(); return; }
  if ('copyjson' in d) {
    save(); const code = JSON.stringify(S, null, 1), ta = $('#save-code'); ta.value = code;
    const fallback = () => { ta.focus(); ta.select(); toast('Save JSON selected. Copy it from the box.'); };
    try { navigator.clipboard.writeText(code).then(() => toast('Save JSON copied'), fallback); } catch(e) { fallback(); }
    return;
  }
  if ('copysave' in d) {
    save();
    const code = b64enc(JSON.stringify(S));
    const ta = $('#save-code'); ta.value = code;
    const fallback = () => { ta.focus(); ta.select(); toast('Save code selected. Copy it from the box.'); };
    try { navigator.clipboard.writeText(code).then(() => toast('Save code copied'), fallback); } catch(e) { fallback(); }
    return;
  }
  if ('ngp' in d) return;   // restarting Act I was removed
  if (d.act2) { chooseBranch('A'); hideModal(); paused = false; taskKey = ''; archKey = ''; renderView(); return; }
  if (d.merge != null) { S.merge = true; hideModal(); paused = false;
    if (S.merge && S.life.sec === 8 && !S.life.dead && complete(T.cutloose)) enterZone(9, 8);
    toast(S.merge ? 'The run continues into the long watch.' : 'The run ends with the boarders. You can still merge from the Archive.'); taskKey = ''; archKey = ''; renderView(); return; }
  if (d.a2adj) return;   // Honours can't be moved once spent
  if (d.ngpadj) { if (ngpAdjust(d.ngpadj, +d.dd)) { sfx('toggle'); archKey = ''; save(); renderView(true); } return; }
  if (d.ngpick) {
    const pr0 = S.pr || {};
    const rw = NGP.find(r => r.id === d.ngpick), allDone = NGP.every(r => ngpLv(r.id) >= r.max);
    if (!S.won || (rw ? ngpLv(rw.id) >= rw.max : d.ngpick !== 'none')) return;
    prestige(d.ngpick); resetViews(); hideModal(); paused = false; save(); setTab('tasks');
    toast('New game plus ' + S.pr.n + ' begins. ' + (rw ? rw.name + ' ' + ngpLv(rw.id) + '/' + rw.max + ': ' + rw.now(ngpLv(rw.id)) + '.' : 'Point kept unspent; spend it in the Archive.'), true);
    return;
  }
  if (L.dead && !d.confirm) return;
  if (d.do) {
    if (isCQ(d.do)) { L.now = d.do; L.foraging = false; L.feeding = false; toast('Running the chain: ' + cSteps(d.do).length + ' steps'); taskKey = ''; renderView(); return; }
    const t = T[d.do];
    // Tapping a task runs it right away; it does not go into the queue (use + for that).
    if (t.kind === 'job' && jobFull(t)) { toast('Storage is full. Spend or use some first.'); return; }
    if (!available(t) || (t.kind !== 'job' && complete(t))) return;
    L.now = t.id; L.foraging = false; L.feeding = false;
    if (t.cross) L.crossNow = t.id;   // started by hand: no waiting at the threshold
    taskKey = ''; renderView(); return;
  }
  if (d.q) {
    if (isCQ(d.q)) {
      if (qAdd(d.q)) toast('Queued as one chain: ' + cSteps(d.q).length + ' steps');
      taskKey = ''; renderView(); return;
    }
    if (isGQ(d.q)) {
      if (qAdd(d.q)) toast((qCount(d.q) > 1 ? 'Queued again (' + qCount(d.q) + '\u00d7): ' : 'Queued: ') + qName(d.q) + ' (works salvage until it can be built)');
      taskKey = ''; gearKey = ''; renderView(); return;
    }
    {
      if (T[d.q].kind === 'job' && jobFull(T[d.q]) && !L.queue.includes(d.q)) toast('Storage is full right now; it runs when there is room.');
      if (!qAdd(d.q)) return;
      const n = qCount(d.q);
      toast((n > 1 ? 'Queued again (' + n + '\u00d7): ' : 'Queued: ') + T[d.q].name + (T[d.q].kind === 'job' ? ' (until storage is full)' : available(T[d.q]) ? '' : ' (runs once it is available)'));
    }
    taskKey = ''; gearKey = ''; renderView(); return;
  }
  if (d.prio) { openPrio = openPrio === d.prio ? null : d.prio; taskKey = ''; renderView(); return; }
  if (d.setprio) { S.prio[d.setprio] = +d.n; openPrio = null; autoKey = ''; toast('Priority ' + d.n + ': ' + T[d.setprio].name); taskKey = ''; renderView(); return; }
  if (d.auto) { autoKey = ''; taskKey = ''; S.auto[d.auto] = !S.auto[d.auto]; toast((S.auto[d.auto] ? 'Automated: ' : 'Automation off: ') + T[d.auto].name); taskKey = ''; renderView(); return; }
  if (d.showlock) { showLocked[d.showlock] = !showLocked[d.showlock]; taskKey = ''; renderView(); return; }
  if (d.unqi != null) { qRemoveAt(+d.unqi); taskKey = ''; gearKey = ''; renderView(); return; }
  if (d.qmove != null) { qMove(+d.qmove, +d.dir); taskKey = ''; renderView(); return; }
  if (d.qsave) { S.qpresets[+d.qsave] = qPlan(L).slice(0, QMAX); toast('Queue saved to preset ' + (+d.qsave + 1)); taskKey = ''; renderView(); return; }
  if (d.qload) {
    const p = (S.qpresets[+d.qload] || []).filter(id => qItem(id)).slice(0, QMAX);
    L.qdone = []; L.queue = p.filter(id => isCQ(id) ? cSteps(id).some(x => !isGQ(x) && !zBefore(T[x].z, L.sec)) : isGQ(id) ? !L.owned[qItem(id).id] : !(T[id].kind !== 'job' && complete(T[id])) && !zBefore(T[id].z, L.sec));
    toast('Loaded preset ' + (+d.qload + 1)); taskKey = ''; renderView(); return;
  }
  if ('secrun' in d) { const sp = runSpan(L.sec || 1); if (sp.length) { L.chainRun = true; L.runFrom = L.sec || 1; L.now = null; toast(sp.length > 1 ? 'Running ' + sp.length + ' sections as one chain: ' + sp.map(z => ZONES[z - 1].name).join(' \u2192 ') : 'Running the ' + ZONES[(L.sec || 1) - 1].name + ' as one chain'); } taskKey = ''; autoKey = ''; renderView(); return; }
  if ('secstop' in d) { L.chainRun = false; L.runFrom = null; taskKey = ''; autoKey = ''; renderView(); return; }
  if (d.copen) { cOpen[d.copen] = !cOpen[d.copen]; taskKey = ''; renderView(); return; }
  if (d.qopen) { qOpen[d.qopen] = !qOpen[d.qopen]; taskKey = ''; renderView(); return; }
  if ('stopnow' in d) { L.now = null; taskKey = ''; renderView(); return; }
  if ('clearq' in d) { L.queue.filter(isCQ).forEach(q => { (L.cdis = L.cdis || {})[q] = 1; }); L.queue = []; L.qdone = []; if (L.held) L.held = null; toast('Queue cleared'); taskKey = ''; renderView(); return; }
  if (d.buy) {
    if (buyItem(d.buy, false)) renderView();
    return;
  }
  if (d.gauto) { S.gauto[d.gauto] = !S.gauto[d.gauto]; autoKey = ''; gearKey = ''; taskKey = ''; toast((S.gauto[d.gauto] ? 'Auto-build on: ' : 'Auto-build off: ') + IT[d.gauto].name); renderView(); return; }
  if (d.gsetprio) { S.gprio[d.gsetprio] = +d.n; autoKey = ''; gearKey = ''; toast('Priority ' + d.n + ': ' + IT[d.gsetprio].name); renderView(); return; }
  if (d.set) { S.set[d.set] = !S.set[d.set]; savePrefs(); autoKey = ''; renderArchive(true); if (tab === 'auto') renderAuto(); return; }
  if (d.confirm) {
    const k = d.confirm;
    if (!confirmT[k]) {
      confirmT[k] = setTimeout(() => { confirmT[k] = null; if (b.isConnected) b.textContent = ({reset:'Restart', recycle:'Recycle', import:'Load pasted text', importfile:'Import save file', ghload:'Load', ngpadd:'+', a2add:'+'})[k]; }, 3000);
      b.textContent = 'Tap again'; return;
    }
    clearTimeout(confirmT[k]); confirmT[k] = null;
    if (k === 'importfile') { b.textContent = 'Import save file'; $('#import-file').click(); return; }
    if (k === 'a2add') { b.textContent = '+'; const id = d.a2r, v = S.a2.lv[id] || 0, free = (S.a2.hon || 0) - Object.values(S.a2.lv).reduce((x, y) => x + y, 0);
      if (v < NGP_MAX && free > 0) { S.a2.lv[id] = v + 1; M = mods(); const r = A2R.find(x => x.id === id); sfx('perk'); toast(r.name + ' ' + (v + 1) + '/' + NGP_MAX + ': ' + r.now(v + 1) + '.'); archKey = ''; save(); renderView(true); } return; }
    if (k === 'ngpadd') { b.textContent = '+'; if (ngpAdjust(d.ngr, 1)) { const r = NGP.find(x => x.id === d.ngr); sfx('perk'); toast(r.name + ' ' + ngpLv(r.id) + '/' + r.max + ': ' + r.now(ngpLv(r.id)) + '.'); archKey = ''; save(); renderView(true); } return; }
    if (k === 'ghload') { b.textContent = 'Load'; ghLoad(+d.gi); return; }
    if (k === 'import') {
      b.textContent = 'Load pasted text';
      const txt = $('#save-code').value.trim();
      parseSaveAny(txt).then(raw => { if (!raw || !raw.life) { toast('That save code isn\u2019t valid.'); return; } applyLoaded(raw, 'save code'); });
      return;
    }
    if (k === 'recycle' && !S.life.dead) die('Recycled by choice');
    if (k === 'reset') {
      S = defaultState(); M = mods(); S.life.hp = M.maxHp; resetViews(); save();
      setTab('tasks'); showIntro();
    }
  }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !S.life.dead && S.intro && !paused) hideModal(); });

function togglePause(){
  S.set.paused = !S.set.paused;
  toast(S.set.paused ? 'Paused. Time is stopped.' : 'Resumed');
  renderSpeed(); save();
}
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== 'p') return;
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'BUTTON' || !$('#modal').hidden) return;
  e.preventDefault(); togglePause();
});

/* ----- loop ----- */
let last = performance.now(), saveT = 0, viewT = 0;
// The game keeps running when the tab is hidden: a slow timer keeps ticking, and any gap
// (tab throttled, phone asleep) is simulated in one go when the page gets time again.
// Gaps longer than awayMax() are partly turned into stasis boost instead.
// awayMax(): see the watch records next to PERKS.
function simulate(dt){
  if (dt <= 0 || S.life.dead || paused || S.set.paused) return;
  let mult = S.set.speed * ngpSpeed(), extra = 0;
  // Stasis boost at xN: each real second plays N seconds; the banked time pays for the extra N-1.
  if (S.set.boost && S.bank > 0) { const x = boostX(); extra = Math.min(S.bank, dt * (x - 1)); mult *= (dt + extra) / dt; S.bank = Math.max(0, S.bank - extra); }
  let left = dt * DPS * mult, done = 0;
  const total = left, perTick = dt / left;
  while (left > 1e-9 && !S.life.dead) {
    const chunk = Math.min(left, 900), d0 = S.life.day;
    advance(chunk);
    const ran = S.life.day - d0;
    done += Math.max(0, ran);
    if (ran > 0) { S.life.real = (S.life.real || 0) + ran * perTick; S.stats.played = (S.stats.played || 0) + ran * perTick; }   // real seconds the clock actually ran
    if (ran < chunk - 1e-6) break;   // stopped: idle, paused or dead
    left -= chunk;
  }
  // boost time is only spent while the clock actually runs: give back the unused part
  if (extra > 0 && done < total - 1e-9) S.bank += extra * (1 - done / total);
  if (S.set.boost && S.bank <= 0) S.set.boost = false;
}
function tick(now){
  let dt = (now - last) / 1000; last = now;
  const cap = awayMax();
  if (dt > cap) { S.bank = Math.min(S.bank + dt - cap, cap); dt = cap; }
  simulate(dt);
  if (pendingDecant) { autoDecant(); simulate(0); }
  saveT += dt;
  if (saveT > 5) { saveT = 0; save(); }
  return dt;
}
function frame(now){
  const dt = tick(now);
  updateHud();
  viewT += dt;
  if (tab === 'tasks') { renderTasks(); updateTasks(); }
  if (tab === 'map') { renderMap(); updateMap(); }
  if (viewT > 0.4) { viewT = 0; renderView(); }
  requestAnimationFrame(frame);
}
// While hidden, animation frames stop; this keeps the clock going (browsers allow about once a second,
// or once a minute after a while, and the catch-up above fills the gaps).
setInterval(() => { if (document.hidden && S && !S.set.bgPause) tick(performance.now()); }, 1000);
/* ----- catch-up screen: what happened while the game ran in the background ----- */
let awaySnap = null;
function snapshot(){
  return {t:Date.now(), gen:S.gen, days:(S.stats.daysLived || 0) + S.life.day, rations:S.life.rations, salvage:S.life.salvage,
    xp:Object.assign({}, S.xpTot || {}), deaths:S.stats.deaths || 0, log:S.log.length, perks:Object.keys(S.perks).length,
    sec:S.life.sec, hp:S.life.hp, owned:Object.keys(S.life.owned).length, hist:(S.hist || []).length};
}
function awayBoostNote(){
  if (!awayState) return 'The time away becomes stasis boost';
  const old = JSON.parse(awayState), was = old.bank || 0, cap = AWAY_BASE + AWAY_STEP * WATCH.filter(p => (old.perks || {})[p.id]).length;
  const add = Math.max(0, Math.min(was + awayGone, cap) - was);
  return '+' + fmtSecs(add) + ' of stasis boost' + (add < awayGone - 1 ? ' (boost full at ' + fmtSecs(cap) + ')' : '');
}
function showAway(a){
  const L = S.life, b = snapshot();
  const days = (b.days - a.days) / TPD, secs = (b.t - a.t) / 1000;
  if (days < 0.05 && b.gen === a.gen) return false;
  const sign = v => (v >= 0 ? '+' : '\u2212') + fmt(Math.abs(v));
  const xpRows = SKILLS.map(k => ({k, g:(b.xp[k.id] || 0) - (a.xp[k.id] || 0)})).filter(r => r.g > 0.5);
  const newLogs = S.log.slice(a.log).map(e => e.t);
  const newPerks = Object.keys(S.perks).length - a.perks;
  let h = `<h2>While you were away</h2><p class="d">${fmtSecs(secs)} in the background \u00b7 ${days.toFixed(1)} days aboard</p><table class="dt">`;
  const loops = b.gen - a.gen;
  h += `<tr><td>Loops run</td><td>${loops}${loops ? ' \u00b7 now clone ' + b.gen : ''}</td></tr>`;
  h += `<tr><td>Section</td><td>${ZONES[(L.sec || 1) - 1].name}${(L.sec || 1) !== a.sec && b.gen === a.gen ? ' (new)' : ''}</td></tr>`;
  h += `<tr><td>Health</td><td>${Math.ceil(L.hp)} / ${M.maxHp}</td></tr>`;
  if (b.gen === a.gen) {
    h += `<tr><td>Rations</td><td>${fmt(L.rations)} (${sign(L.rations - a.rations)})</td></tr><tr><td>Salvage</td><td>${fmt(L.salvage)} (${sign(L.salvage - a.salvage)})</td></tr>`;
    if (b.owned > a.owned) h += `<tr><td>Gear built</td><td>${b.owned - a.owned}</td></tr>`;
  }

  h += '</table>';
  // the clones that lived and died while away (also kept in the Log tab's run history)
  const ran = (S.hist || []).slice(Math.max(0, (S.hist || []).length - loops));
  if (loops) {
    const secName = n => n >= 6 ? 'Drive lit' : ZONES[n - 1].name;
  const histName = e => e.z && isA2(e.z) ? ZN(e.z).name : secName(e.sec);
    h += `<div class="rtab"><table class="dt"><thead><tr><th>Clone</th><th>Furthest</th><th>Days</th><th>Cause</th></tr></thead><tbody>${ran.slice(-10).reverse().map(e => `<tr><td>${e.g}</td><td>${histName(e)}</td><td>${(e.d / TPD).toFixed(1)}</td><td>${esc(e.cause)}</td></tr>`).join('')}</tbody></table></div>`;
    if (loops > 10) h += `<p class="d">Showing the last 10 of ${loops} loops.</p>`;
    const far = ran.reduce((m, e) => Math.max(m, e.sec), 0);
    S.log.push({g:b.gen, a:+(L.day / TPD).toFixed(1), t:'Background run', x:loops + ' loop' + (loops > 1 ? 's' : '') + ' ran while you were away (clones ' + a.gen + '\u2013' + (b.gen - 1) + '), furthest: ' + secName(far) + '.'});
    if (S.log.length > 120) S.log.shift();
    logKey = '';
  }
  if (newPerks > 0) h += `<p class="d">New archive record${newPerks > 1 ? 's' : ''}: ${newPerks}.</p>`;
  if (newLogs.length) h += `<p class="d">Log: ${esc(newLogs.join(', '))}.</p>`;
  h += '<p class="d">The game is paused until you choose.</p><div class="btns"><button class="btn pri" data-awayok>Keep this progress</button><button class="btn" data-awayundo>Discard it and go back<small>' + awayBoostNote() + '</small></button></div>';
  paused = true; showModal(h);
  return true;
}
let awayState = null, awayAt = 0, awayGone = 0, bgHideAt = 0;   // the whole game as it was when the tab was hidden, to undo the away progress
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    save();
    if (S.set.bgPause) { bgHideAt = Date.now(); return; }   // option: nothing happens in the background
    if ($('#modal').hidden && !S.life.dead) { awaySnap = snapshot(); awayState = JSON.stringify(S); awayAt = Date.now(); }
    return;
  }
  if (S.set.bgPause) {   // skip the gap, but the hidden time becomes stasis boost
    last = performance.now();
    if (bgHideAt) {
      const gone = Math.max(0, (Date.now() - bgHideAt) / 1000), before = S.bank || 0;
      bgHideAt = 0;
      S.bank = Math.min(before + gone, awayMax());
      const added = S.bank - before;
      if (added >= 1) { save(); renderSpeed(); toast('Paused while away: +' + fmtSecs(added) + ' added to the stasis boost (now ' + fmtSecs(S.bank) + ')' + (added < gone - 1 ? '; the boost is full.' : '.')); }
    }
    return;
  }
  if (!awaySnap) return;
  awayGone = Math.max(0, (Date.now() - awayAt) / 1000);   // how long the tab was hidden
  tick(performance.now());   // finish catching up first
  const a = awaySnap; awaySnap = null;
  if ($('#modal').hidden || S.life.dead) showAway(a);
});
window.addEventListener('pagehide', save);

/* ----- Android app: check GitHub for a newer build ----- */
const APK_URL = 'https://github.com/hufle-beep/long-patience/releases/download/android-latest/LongPatience.apk';
let appUpdate = null, updStatus = '', updBusy = false;
const UPD_KEY = 'long-patience.update.v1';
const UPD = {auto:true, autoInstall:false};
try { Object.assign(UPD, JSON.parse(localStorage.getItem(UPD_KEY) || '{}')); } catch(e) {}
function updSave(){ try { localStorage.setItem(UPD_KEY, JSON.stringify(UPD)); } catch(e) {} }
const inApp = () => !!(window.AndroidBridge && AndroidBridge.versionCode);
function myBuild(){ try { return AndroidBridge.versionCode(); } catch(e) { return 0; } }
function setUpd(msg){ updStatus = msg; const el = document.getElementById('upd-st'); if (el) el.textContent = msg; }
function checkAppUpdate(manual){
  if (!inApp()) return;
  const mine = myBuild();
  if (manual) setUpd('Checking GitHub\u2026');
  fetch('https://api.github.com/repos/hufle-beep/long-patience/releases/tags/android-latest', {cache:'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
      const m = j && j.name && j.name.match(/build (\d+)/);
      if (!m) { setUpd('No app build found on GitHub.'); return; }
      appUpdate = {build:+m[1], mine};
      if (appUpdate.build > mine) {
        setUpd('Build ' + appUpdate.build + ' is available (you have ' + mine + ').');
        if (!manual && UPD.autoInstall) startAppUpdate();
        else if (!manual) toast('App update available: build ' + appUpdate.build + '. Install it from Settings.', true);
      } else setUpd('You have the latest build (' + mine + ').');
      refreshSettings();
    }).catch(() => { if (manual) setUpd('Couldn\u2019t reach GitHub. Check your connection.'); });
}
function startAppUpdate(){
  if (!inApp() || updBusy) return;
  if (!(AndroidBridge.downloadUpdate)) { setUpd('This app build can\u2019t self-update. Download the new version from the link below once.'); return; }
  updBusy = true; save(); setUpd('Downloading\u2026');
  AndroidBridge.downloadUpdate(APK_URL);
}
// Called by the Android app while downloading and installing
window.onAppUpdate = (state, msg) => {
  if (state === 'progress') setUpd('Downloading\u2026 ' + msg + '%');
  else { updBusy = false; setUpd(msg); if (state === 'error') sfx('error'); }
};
let settingsFrom = null;
function updatePanel(){
  if (!inApp()) return `<div class="panel set"><span class="h2">App updates</span>
    <p class="note">You are playing in a browser, which always has the newest version. The Android app can be downloaded here:</p>
    <p class="note num" style="word-break:break-all;user-select:all">${APK_URL}</p></div>`;
  const avail = appUpdate && appUpdate.build > appUpdate.mine;
  const tg = (k, label, note) => `<div class="row"><p>${label}<small>${note}</small></p><button class="tog${UPD[k] ? ' on' : ''}" data-upd="${k}" aria-label="${label}" aria-pressed="${UPD[k]}"></button></div>`;
  return `<div class="panel set"><span class="h2">App updates</span>
    <p class="note">Installed: build ${myBuild()}${appUpdate ? ' \u00b7 latest on GitHub: build ' + appUpdate.build : ''}. Updates install over this version and keep your saves.</p>
    ${tg('auto', 'Check automatically', 'Look for a new build each time the app starts.')}
    ${tg('autoInstall', 'Install automatically', 'Download a new build as soon as it is found and open the installer. Android still asks you to confirm.')}
    <div class="btns"><button class="btn" data-updcheck>Check now</button><button class="btn pri" data-updinstall ${avail && !updBusy ? '' : 'disabled'}>${avail ? 'Download and install build ' + appUpdate.build : 'Up to date'}</button></div>
    <div class="ghst" id="upd-st" role="status">${esc(updStatus)}</div></div>`;
}
function showSettings(from){
  settingsFrom = from; paused = true;
  showModal(`<h2>Settings</h2>${soundPanel().replace('panel set', 'panel set mpanel')}${displayPanel('mpanel')}${updatePanel().replace('panel set', 'panel set mpanel')}
    <button class="btn pri" data-settingsclose>${from === 'menu' ? 'Back to menu' : 'Close'}</button>`);
}
function refreshSettings(){ if (settingsFrom && !$('#modal').hidden && document.getElementById('upd-st')) showSettings(settingsFrom); }
function boot(data){
  applyLayout();
  if (UPD.auto) setTimeout(() => checkAppUpdate(false), 2500);
  const raw = (data && data.S) || loadSaved();
  S = mergeState(raw);
  M = mods();
  if (!raw) S.life.hp = M.maxHp;
  if (S.set.startPaused && !S.life.dead) S.set.paused = true;   // option: open the game paused
  if (raw && raw.saved) S.bank = Math.min((S.bank || 0) + Math.max(0, (Date.now() - raw.saved) / 1000), awayMax());
  setTab('tasks');
  if (raw) showMenu(); else startGame();
  last = performance.now();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({S: JSON.parse(JSON.stringify(S))})); } catch(e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
