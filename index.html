<style>
/* Layout: one-column ship console. Sticky readout header, scrolling task list, fixed tab bar. Single dark look (heartwood browns, amber resin) by choice. */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
:root{
  --bg:#1a140c; --panel:#241b10; --panel2:#2e2316; --line:#4a3920; --line2:#6b5532; --fg:#f2e6c9; --dim:#b39b6c; --faint:#786245;   /* Root-Kin palette: heartwood browns, amber resin */
  --amber:#f0a03c; --amber-soft:rgba(240,160,60,.14); --amber-fill:rgba(240,160,60,.22);
  --cyan:#63c6d4; --cyan-soft:rgba(99,198,212,.16); --red:#e2604f; --red-t:#f2866f; --green:#7cc47f; --violet:#a98cf0; --sand:#d8c49a; --yellow:#f2d54b;
  --f-disp:'Selene Display','Arial Narrow',sans-serif;
  --f-body:'Selene Text',system-ui,-apple-system,sans-serif;
  --f-mono:'Selene Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--dim);font-weight:600}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 10px}
#hud .wrap{display:grid;gap:7px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.ident{display:flex;align-items:center;gap:6px 8px;flex:0 1 auto;flex-wrap:wrap;white-space:nowrap}
.htimes{display:inline-flex;gap:10px;flex-wrap:wrap}
.ident .htimes span{font-family:var(--f-mono);font-size:13px;letter-spacing:0;text-transform:none}
.ident .hday{color:var(--cyan)}
.ident .hday .tgm{color:var(--cyan)}.ident .hday .trl{color:var(--amber)}
.ident .hleft{color:var(--red-t)}
.ident b{white-space:nowrap;font-family:var(--f-disp);font-size:22px;font-weight:600;letter-spacing:.04em;color:var(--amber);line-height:1}
.ident span{font-family:var(--f-disp);font-size:14px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.spd{display:grid;grid-template-columns:44px 44px 1fr 94px;gap:6px;flex-basis:100%;width:100%;margin-left:0}   /* the speed box is as wide as the two buttons on the left, so Pause sits in the middle */
.spd .bsel.off{border-color:var(--line);color:var(--faint)}
.spd>*{min-width:0;height:36px;box-sizing:border-box}
.spd button.flip,.spd button.mus{padding:0;text-align:center}
.spd button{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.spd button.on{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.spd button.mus{font-size:14px;padding:3px 9px;color:var(--faint);text-decoration:line-through}
.spd button.mus.on{color:var(--cyan);border-color:var(--cyan-soft);background:none;text-decoration:none}
.vol{display:grid;grid-template-columns:auto 1fr 34px;gap:10px;align-items:center}
.vol b{font-size:12px;text-align:right;font-weight:500}
.mpanel{background:var(--panel2)}
.spd button.pause{color:var(--fg)}
.spd button.pause.on{background:var(--cyan);border-color:var(--cyan);color:var(--bg)}
.now.paused{border-color:var(--cyan)}
.spd .bsel{display:flex;align-items:stretch;font-family:var(--f-mono);font-size:13px;padding:0;border:1px solid var(--cyan-soft);border-radius:4px;color:var(--cyan)}
.spd .bsel.on{background:var(--cyan);color:var(--bg)}
.spd .bsel select{font:inherit;color:inherit;background:transparent;border:0;padding:0;width:100%;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;cursor:pointer}
.spd .bsel select option{color:var(--fg);background:var(--panel)}
.meter{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:8px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px}
.bar.hp i{background:var(--red)}
.bar.xp i{background:var(--cyan)}
.meter span{font-size:12px;color:var(--fg);min-width:92px;text-align:right}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res>div{display:flex;align-items:baseline;gap:6px;background:var(--panel2);border-radius:4px;padding:5px 8px;min-width:0}
.res b{font-size:15px;font-weight:500}
.res .cap{font-size:11px;color:var(--faint);font-weight:400}
.res b.full{color:var(--amber)}
.res>div{flex-wrap:wrap}
.res small.rt{flex-basis:100%;margin-left:0;color:var(--dim);font-size:11px}
.res small.rt.neg{color:var(--red-t)}
#t-ratt{white-space:pre-line;overflow-wrap:anywhere}   /* one short line each: cells, station, crossing */
.foods{flex-basis:100%;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--fg);font-family:var(--f-mono)}
.foods em{font-style:normal;color:var(--dim)}
.foods span.full{color:var(--amber)}
.foods span i{font-style:normal;color:var(--faint)}
.surv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px}
.surv b{font-size:14px;font-weight:500}
.surv span{color:var(--dim)}
.surv em{font-style:normal;color:var(--dim)}
.surv .plan{flex-basis:100%;color:var(--cyan)}
.surv .plan.over{color:var(--amber)}
.task.rest .tm{border-style:dashed}
.task.train .tm{border-style:dotted}
.mn.train .mb{stroke-dasharray:1 3}
.surv.warn b,.surv.warn em{color:var(--red-t)}
.tx .tt{color:var(--dim)}
.gtm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.gtm:disabled{cursor:default}
.gcost{font-size:12px;color:var(--dim);white-space:nowrap;align-self:center}
.eat.rep{border-color:var(--cyan);color:var(--cyan)}
.eat{flex-basis:100%;margin-top:4px;font-size:12px;padding:5px 8px;border:1px solid var(--green);color:var(--green);border-radius:4px;text-align:center}
.eat:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.eat:not(:disabled),.eat.rep:not(:disabled){background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:600}   /* ready: the action of the moment */
.res .fq{display:block;font-size:11px;color:var(--green);font-family:var(--f-mono);font-weight:400;margin-top:2px}
.res small{font-size:11px;margin-left:auto;white-space:nowrap}
.res small#t-wear{white-space:normal}
.pos{color:var(--green)} .neg{color:var(--red-t)}
.ngp{border-color:var(--cyan-soft)}
.ngp .h2{color:var(--cyan)}
.bld{margin:-6px 0 10px;font-size:11px;color:var(--faint)}

<script id="logic">
// Renamed from Long Patience: move this device's old storage keys to the new 'selene.' names once
try { const old = []; for (let n = 0; n < localStorage.length; n++) old.push(localStorage.key(n)); old.forEach(k => { if (k && k.indexOf('long-patience.') === 0) { const nk = 'selene.' + k.slice(14); if (localStorage.getItem(nk) == null) localStorage.setItem(nk, localStorage.getItem(k)); localStorage.removeItem(k); } }); } catch(e) {}
/* ===== Game data and rules (no DOM) ===== */
const BUILD = '2026-11-05 · information';   // shown in the main menu, to tell which version is loaded
const DPS = 8;             // simulation ticks per real second at 1x (doubled for the test version: same balance, half the real time)
// Time is simulated in ticks. 80 ticks make one day unit (18 minutes each), so a day lasts
// 20 real seconds at 1x and Players only ever see in-game time and real time, never days.
const TPD = 80;
const JOB_CYCLE = 8;       // in-game days of base work per job batch
const MEAL_CD = 40;        // ticks between recharges: one recharge per cooldown
const HUNGER = 0.15;       // base health lost per tick, always, while time runs
// Strain: the body wears down. The hunger drain is multiplied by strain, which climbs
// (The fault is gone: energy drain no longer grows over a seedling's life.)
const MAX_DRAIN = 1.2;     // most health a young seedling can lose per tick (the cap grows with age, see drainNow)
// Difficulty: the drain cap doubles every CAP_DOUBLE day units (10 s in-game each) of a seedling's life, so strain always wins in
// the end (good feeding buys time, not immortality); and each section is a little more dangerous than the

function bindFoodPct(){

    pl.forEach(t => { h += `<div class="arow pend"><div class="an"><b>${esc(t.name)}</b><span>${KIND_LABEL[t.kind]} \u00b7 auto ${S.prac[t.id] || 0}/${autoNeed(t)} ${t.kind === 'train' ? 'sessions' : 'finishes'}</span></div><span class="pp num"><span class="paut">${pctTxt(autoFrac(t))}</span></span></div>`; });
    pg.forEach(i => { h += `<div class="arow pend"><div class="an"><b>${esc(i.name)}</b><span>Gear \u00b7 built in ${(S.gprac || {})[i.id] || 0}/${gearNeed(i)} lives</span></div><span class="pp num"><span class="paut">${pctTxt(gearAutoFrac(i))}</span></span></div>`; });
    h += '</div></section>';
    return h; });
  $('#v-auto').innerHTML = h;

}


/* ----- FAQ ----- */
const FAQ_ALL = [
  ['Selene and the Root-Kin', 'The Root-Kin of Earth grow their technology: tools, cities, vehicles and ships come from specialised trees, hardened with magic. It is a highly advanced techno-magical civilisation, and everything in it is organic. There are no nation states left, but the local cultures are kept alive. One World Government has ruled for thousands of years: a democracy with slight meritocratic elements. <b>Selene</b> is one of their colony ships: a long, swept hull of living wood with crescent wings, grown around the <b>Hearth Tree</b>, which is her drive, her mind (WARDEN) and her garden at once. Root-Kin ships ride the ambient magic that saturates the universe, close to the speed of light, inside magical ward-shields and under artificial gravity, and can turn on any axis without strain. That is why, halfway there, Selene has to <b>flip</b> and brake for the rest of the voyage. Seedlings like K-7 are disposable drones of WARDEN and the Hearth Tree, grown for a single task and given just enough autonomy to carry it out.'],
  ['What is the goal?', 'Restore Selene so WARDEN can wake the sleeping crew. All of Act I happens inside the Hearth Tree, her drive, mind and garden at once: the sap flow that powers her in the Taproot Galleries, the meteor wounds in her hull in the Shattered Bark, WARDEN\u2019s mind and the star-charts in the Heartwood, the food gardens in the Canopy Gardens, and the Hearthfire in the Ember Crown. Act I ends when you kindle the Hearth Tree. One seedling cannot do it all; it takes many lives (around 50 with very good play).'],
  ['How do I start?', 'Tap a task to work on it right away. Climb out of the seed pod first, then tap the vault\u2019s sap line for sap cells and strip dead bark panels for deadwood. Time only moves while your seedling is working: with nothing to do, the clock stops, so you can always read and plan. Hold a card, icon or button for a moment (or hover with a mouse) to see what it does. The strip under the section name shows what this seedling has done so far, in order (amber actions, green charging, sand deadwood, violet drills, cyan crossings); the death screen shows the whole life. In <b>Edit list</b>, <b>Pin</b> puts a task or gear design at the top of the Tasks tab with what it still needs. Holding the Energy line shows what makes up the drain.'],
  ['What are jobs, actions and training?', '<b>Jobs</b> repeat and make sap cells or deadwood in batches; they stop when that storage is full. <b>Actions</b> are one-off tasks that unlock things and move the story on. Each needs certain earlier actions, and a section\u2019s last action (its crossing) needs every other action of that section. Tasks you have met before stay listed, greyed out, until what they need is done; you can still queue them. <b>Drills</b> each add a little familiarity to every task in their section, up to 4 sessions per life. Small icons by a task\u2019s name show what it holds from the start: a <b>star</b> for a record not found yet, a <b>cog</b> for a gear design it opens, an <b>arrow</b> for a crossing. Its effects show once a seedling has finished it, grouped by how long they last: <b>This seedling</b> (storage, recharges, deadwood per minute: gone at death) and <b>Kept</b> (records, familiarity from drills). <b>Edit list</b> (above the section) lets you star tasks, which puts them at the top of their section, or hide them: hidden tasks fold into one line at the bottom (tap it to show them) and still run when queued, automated or chained. Crossings and chain cards can\u2019t be hidden. Both are kept in the save.'],
  ['How does the queue work?', 'Tapping a task runs it right away, ahead of the queue (a job runs until its store is full); it is not added to the queue. Tapping a gear card works the same way: it is built right away, after gathering the deadwood (grafts in Act II) it still needs. <b>+</b> adds a task to the end of the queue; drag it or use the arrows to move it up. You can queue the same task several times at different places: tap + again for another copy. A task queued once runs until it is done; with several copies, each copy covers one repetition (one training session, one rep, or one fill of a store). The queue holds up to 100 items. Drag an item by the handle on its left to move it, or use the arrows; ✕ removes it. Queued jobs run until their storage is full. You can queue things you have seen before even if they are not available yet; they wait their turn. Gear can be queued too, with the <b>+</b> on its card (gear is listed in each section of the Tasks tab): the seedling works the best deadwood job until it can afford the design, then builds it. Five presets save and load whole queues (tap a preset\u2019s number to name it), <b>Copy / paste</b> turns the queue into plain text and back (a pasted line that isn\u2019t a known name gets a \u201cdid you mean\u201d tip, and one that can\u2019t run yet says why), and <b>Undo</b> takes back the last change to the queue. Tap a row\u2019s name to <b>skip</b> it: it stays in the queue but doesn\u2019t run until you tap it again. Press and hold <b>+</b> on a drill or a task with several reps to queue one copy per repetition still to do. <b>Least familiar</b> sorts the queue so the weakest tasks run first (chains stay on top). <b>Triggers</b> load a preset by themselves when a new seedling sprouts or when it enters a section you choose, or any section from there through a later one. Each rule can be switched off, kept for every 2nd, 3rd\u2026 seedling, and moved up or down: when several match at once, only the highest fires (each rule at most once per seedling). <b>Keep queue between seedlings</b> gives each new seedling the queue you planned, minus anything that is automated and switched on. <b>The forecast:</b> the game plays your seedling\u2019s life forward with the same rules (queue, automation, recharges, crossings), so each queue row shows the energy left when it is done and when that will be; rows the seedling won\u2019t reach turn red, and <b>Dies here</b> marks the row where it dies. The Outlook line gives the forecast death and its cause; a setting can pause the game once, just before it. When the forecast death comes from energy or wear and a setting that is off or low (Auto-recharge, Auto-charge, the charge threshold, Charge when needed, and in Act II Auto-scavenge and Auto-repair) would make the seedling live clearly longer, the Outlook line names it and how much time it adds. <b>Clear queue</b> keeps the row the seedling is working on. <b>+ Row</b> by a preset adds a queue row that loads it: once every row above it is done (or skipped), the preset replaces that row and everything below it. Each preset loads this way once per seedling; the row goes along when the queue carries over to the next seedling. A dot marked <b>new</b> on a task means no seedling has finished it yet. Tap a row\u2019s number to add new tasks after it instead of at the end (<b>Next</b> puts them after the row being worked on; <b>End</b> goes back). <b>1\u00d7</b> on a row runs it for this seedling only: the next seedling\u2019s queue leaves it out. Hold a row\u2019s \u2715 to remove every copy of that task. With a keyboard, keys 1 to 5 load the presets.'],
  ['Energy and sap cells', 'Seedlings are biomechanical: as long as they have energy, the body is sustained. The <b>Energy</b> bar drains all the time; each recharge uses one <b>sap cell</b> and puts energy back. <b>Every recharge restores the same amount</b>; what changes is how often the seedling can recharge. Sap cells are carried up to the seedling\u2019s <b>storage capacity</b>, which grows as the seedling gets deeper into the ship (5 in the Seedling Vaults, up to 90 in the Ember Crown, in steps of 5), plus gear and records. Each section has a <b>charging station</b> job, but it only opens partway into the section and holds a limited <b>reserve</b> per seedling life; when it is drained, the seedling has to cross or run down. Every crossing also costs a share of the cells carried, more the further into the ship you go, so a seedling always arrives living on what it brought. At first a seedling can recharge every 5 seconds of in-game time. Each section has one <b>charger upgrade</b> action that shortens the wait between recharges for the rest of that life, down to about 2 seconds, and adds half again to that section\u2019s station reserve; each seedling has to fix them again. Recharges are always whole, and the seedling only recharges when it needs to: when a whole recharge fits under full energy, or sooner once energy is down to half. At full energy no cell is used. With no cells left at all, the seedling runs down. The Hive Ship\u2019s only charging comes late, so arrive charged.'],
  ['What carries over when a seedling dies?', '<b>Familiarity</b> is kept: every task stays as fast as your seedlings have made it (see the Mastery tab). Every 10 seconds of in-game time a seedling survives is analysed afterwards, run and memory alike, and becomes an <b>efficiency patch</b>: later seedlings drain their energy a little more slowly, up to \u00f71.6. <b>Archive records</b> found by finishing certain actions are permanent upgrades. Gear, sap cells, deadwood and progress through the ship reset.'],
  ['What are sections?', 'Act I is split into six sections. The <b>Route</b> at the top of the Map tab shows them all in order (sections no seedling has reached show as ?); tap one for its year, crossing cost and danger. Below it, tap a section\u2019s name to fold or open it. The Map, Auto, Mastery, Archive and the Ship log fold the same way: sections behind the seedling start folded, the one it is in and those ahead start open, and once an act is done its sections sit together under one act header. What you open or fold is kept on this device. A <b>red</b> action leads to the next one, and the way back is sealed for that seedling, so finish what you need first (records, training, gear). Each new seedling starts back in the Seedling Vaults.'],
  ['What is gear?', 'Gear is built from deadwood (called grafts in Act II: the same store) and lasts for one seedling. Each section has designs to build. Building one pays its deadwood up front, then the seedling spends time <b>assembling</b> it (bigger designs take longer, from a moment for a toolkit to half a minute or so of in-game time for the largest); assembly comes before other work and gets faster with familiarity. The gear works once it is assembled. Deadwood storage is limited; opening up more of the ship raises it.'],
  ['What is familiarity?', 'There are no skills: each task gets faster on its own the more of it your seedlings have done. Familiarity counts work in completions, including attempts a seedling died in the middle of, and is kept between seedlings. Speed rises smoothly from ×1 to ×10 once you have done enough of a task: in a first run, 90 lives’ worth of it (90 finishes of an action, 1800 batches of a job). Each level of the <b>Echo</b> legacy theme lowers that for Act I tasks. Familiar tasks also hurt less (hazard damage up to ÷4), and a familiar charging station charges faster. <b>Drills</b> spread familiarity to every task in their section. The Mastery tab lists every task. Familiarity has named steps: <b>Practiced</b> at \u00d72 (tasks can be linked), <b>Skilled</b> at \u00d75 (one-tap section runs) and <b>Mastered</b> at \u00d710. A task card shows the time familiarity saves on each completion (in green), and its tooltip says how many completions to the next step and how far automation is.'],
  ['How does automation work?', 'Every completion counts: finish an action 10 times (a multi-rep action 10 times its reps), or a training session 40 times, or build a design in 10 lives, and its automation <b>switches on by itself</b>. For Act I tasks these counts shrink along with the familiarity threshold (Echo legacy), never below one; tap <b>AUTO</b> (or its switch in the Auto tab) to turn it off, and it stays off. Automated tasks run by themselves <b>ahead of your queue</b>, in chain order (each after the tasks it needs). Automated tasks <b>link into chains</b> when one requires the other and both are at least ×2 familiar. When every action and crossing of a section is automated and ×5 familiar, and all its gear designs are automated, the whole section becomes <b>one chain</b>: press <b>▶ Run section</b> (above the queue in the Tasks tab) and the seedling works through everything, builds the gear, fills its stores and crosses. The run is pinned at the top of the queue and the queue\u2019s leftovers for its sections are cleared. Pressing it also turns on <b>Always run sections once ready</b> (Auto tab): from then on a run starts by itself whenever the section you are in is ready. Stop turns that off again. Ready sections next to each other link across their crossings into one run (<b>▶ Run 3 sections</b>), up to the end of the act; a run that dies starts again with the next seedling. The option <b>Pause when a section run ends instead</b> keeps a run going through its crossings and pauses once it is over. A chain picks its next step itself each time: gear first, then charger upgrades, then the actions and drills in the order they depend on each other, and the crossing last. When a chain forms or grows, it <b>queues itself</b>, including the chains of sections still ahead, and chain entries are kept in the order they will run: section by section, and within a section the chain that starts earliest first, with the crossing\u2019s chain last, and anything of it you had queued separately is dropped from the queue. If you remove a chain from the queue, it stays out for the rest of that seedling\u2019s life. Work done as part of a chain (a queued chain or a section run) builds <b>chain flow</b>, which makes chained steps up to five times as fast; it is kept for good. Jobs are never automated: auto-forage keeps the charge up, queued gear works the deadwood jobs, and every queued or automated crossing tops the sap cells up and fills deadwood to full carry before the seedling moves on. <b>Automated gear gathers its own deadwood</b> during the life: the next automated design that is found, not built and fits in storage; it gathers only what that design costs and does not top the store up to full (except while filling up before a crossing). Automated <b>crossings</b> are the exception: they wait until your queue is done. A task you tap runs before everything. The <b>Auto</b> tab lists everything unlocked and has extra options: charging when needed, the death screen and starting paused. Each section\u2019s header names its <b>next automation</b>: the task closest to it, its completions, and whether this seedling gets there (from the forecast) or about how many more seedlings it takes. The death screen sums up each life: familiarity gained, records found, tasks that became automatable and the closest ones; the Mastery tab shows the in-game time spent on each task by this seedling and by all of them (counted from build \u201cqueue summaries\u201d). The <b>gears switch</b> next to Pause (shown once something is automated) pauses all automation at once: automated tasks, auto-built gear and section runs wait, while the queue, tapped tasks and auto-charge keep working. Tap it again to resume.'],
  ['What happens at a crossing with automation?', 'A queued or automated crossing stops just before it finishes and waits while the seedling finishes automated actions and training, builds affordable automated gear and tops sap cells up and fills deadwood (grafts in Act II) to full carry, unless the seedling is out of cells and low on energy. Tap a crossing yourself to go at once.'],
  ['Pause, saving and speed', 'Progress is saved on this device only (this browser or the app); use <b>Save files</b> in the main menu (\u2630) to back it up or move it, and <b>Restart</b> next to the slot there to start this slot over. Pause with the button at the top or the space bar. The game only runs while it is on screen: in another app, a background tab or closed, the clock stops and carries on where it left off. Each <b>Stasis watch</b> record (one for leaving each section the first time) tunes the seedlings\u2019 stasis: energy drains a little slower, more with each one, up to \u221250% in all. The <b>speed menu</b> (\u00bb) at the top appears once Act I has been cleared: \u00d72 then, and \u00d75 once Act II has been cleared. It is a flat speed-up of real time, kept on this device for every save. Opening a save you haven\u2019t played for more than a day shows a short <b>Welcome back</b> recap. The <b>Log</b> tab has filters (Deaths, Records, Automation, Story); records and automation are listed there as they happen. Messages are also read out by screen readers.'],
  ['Save management', 'The game saves itself every few seconds on this device. <b>Save Management</b> in the \u2630 menu holds: the five <b>save slots</b> (give each a name when you start a new game or save into it, or with <b>Rename</b>; load one, copy your current game into another as a save state with \u201cSave here\u201d, or delete one); under each used slot, its <b>death save</b>, written automatically at every death in that slot (load it to go back to that death; playing it never changes the regular slot. If it is too far gone, load the regular slot again from there, which deletes that death save. Deleting or starting over a slot removes its death save too); <b>Backups</b> under each slot, kept by themselves after 5 minutes, 30 minutes and 2 hours of play and just before a slot is replaced or deleted (tap Restore to bring one back; what the slot held is backed up first; \u201cExport all saves\u201d takes them along); <b>Restart</b>, next to the slot you are playing, which starts that slot over; and <b>Save files and transfer</b>: export a save file, import one, copy the save as text to move it between devices, or share it to the game\u2019s GitHub folder and load shared saves from there. A game that holds a broken number is never saved over your last good save: a message says so instead. If the browser refuses to save (storage full or blocked), a message says why and offers the export at once. After an hour of play and a day without an exported save, a note reminds you to export one (turn it off under Save file).'],
  ['Settings', '<b>Settings</b> (the ⚙ button, or Settings in the ☰ menu) holds the clock and pause options (death screen, starting paused, once on first reaching a section, after a new section, when a section run ends or when a task finishes), sound (music and effects), layout (vertical or horizontal), text size (90% to 130%, kept on this device), Show formulas (tooltips add the formulas behind drain, speed and crossing costs) and, in the Android app, app updates. Energy and automation options (auto-recharge, auto-charge, the charge threshold, charging when needed) are in the Auto tab.'],
];

const FAQ_NGP = ['Legacy tasks', 'There is no restarting: after the Hearth Tree is kindled, the story always moves forward. As Act II unfolds, <b>legacy tasks</b> open up in Act I, one theme at a time. Each theme adds a set of five parts to every Act I section, open once a seedling has done that section\u2019s last regular action: two pairs of steps, then a <b>final</b> that needs both pairs. Revealed sets are <b>needed for the crossing</b> (and for kindling the Hearth Tree). Finishing a final gives its bonus for the rest of that life, growing with the final\u2019s mastery (nothing untrained, full share at twice the usual familiarity). All six finals of a theme (one per Act I section), done and mastered, give its full effect. Each set has an optional <b>drill</b> that trains only its five parts; section drills don\u2019t train them. Legacy parts are never queued for you: a toast and a dot on the Tasks tab say when they open up. Once automated they join chains and section runs like any other task. The <b>Legacy</b> tab shows what each revealed theme does and how far it has got. Kindling the Hearth Tree the first time also unlocks the <b>Quartermaster\u2019s cache</b>: every seedling starts with all of its automated gear already built, in both acts.'];

/* ----- loop ----- */
let last = performance.now(), saveT = 0, viewT = 0;
// The game keeps running when the tab is hidden: a slow timer keeps ticking, and any gap
// (tab throttled, phone asleep) is simulated in one go when the page gets time again.
// The clock only runs while the game is on screen (no away time).

function simulate(dt){
  if (dt <= 0 || S.life.dead || paused || S.set.paused) return;
  const mult = gameSpeed() * ngpSpeed();
  let left = dt * DPS * mult, done = 0;
  const total = left, perTick = dt / left;
  while (left > 1e-9 && !S.life.dead) {
    const chunk = Math.min(left, 900), d0 = S.life.day;
    advance(chunk);
    const ran = S.life.day - d0;
    done += Math.max(0, ran);
    if (ran > 0) { S.life.real = (S.life.real || 0) + ran * perTick; S.stats.played = (S.stats.played || 0) + ran * perTick; }   // real seconds the clock actually ran
    if (ran < chunk - 1e-6) break;   // stopped: idle, paused or dead
    left -= chunk;
  }
}
function tick(now){
  let dt = (now - last) / 1000; last = now;
  if (document.hidden || !(dt > 0) || dt > 1) dt = 0;   // no away time: the game only runs while it is on screen; a stall, a resumed app or a clock jump counts nothing
  simulate(dt);
  if (pendingDecant) { autoDecant(); simulate(0); }
  saveT += dt;
  if (saveT > 15) { saveT = 0; save(); unlockSpeeds(); }   // also saved on hide, exit, death and crossing
  return dt;
}
// The simulation and the forecast run every frame; the screen is redrawn 10 times a second
// (bars glide in between with a CSS transition), twice a second while paused, dead or behind a pop-up,
// and at once after any tap or key (uiN counts input).
const UI_MS = 100, UI_IDLE_MS = 500;
let uiT = -1e9, uiN = 0, uiSeen = -1;
['pointerdown', 'pointerup', 'click', 'keydown', 'change', 'input'].forEach(ev => document.addEventListener(ev, () => { uiN++; }, true));
function frame(now){
  requestAnimationFrame(frame);   // first, so an error further down never stops the game loop
  const dt = tick(now);
  fcTick();
  viewT += dt;
  const idle = paused || S.set.paused || S.life.dead;
  if (uiN !== uiSeen || now - uiT >= (idle ? UI_IDLE_MS : UI_MS)) {
    uiSeen = uiN; uiT = now;
    updateHud(); tipCheck();
    if (tab === 'tasks') { renderTasks(); updateTasks(); }
    if (tab === 'map') { renderMap(); updateMap(); }
  }
  if (viewT > 0.4) { viewT = 0; renderView(false, true); }
}
// No away time: the clock stops whenever the game is not on screen and carries on where it left off.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); return; }
  last = performance.now();
});
