<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241b10">
<title>Selene: Tidelocked</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column ship console. Sticky readout header, scrolling task list, fixed tab bar. Single dark look (heartwood browns, amber resin) by choice. */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
:root{
  --bg:#1a140c; --panel:#241b10; --panel2:#2e2316; --line:#4a3920; --fg:#f2e6c9; --dim:#b39b6c; --faint:#786245;   /* Root-Kin palette: heartwood browns, amber resin */
  --amber:#f0a03c; --amber-soft:rgba(240,160,60,.14); --amber-fill:rgba(240,160,60,.22);
  --cyan:#63c6d4; --cyan-soft:rgba(99,198,212,.16); --red:#e2604f; --green:#7cc47f; --violet:#a98cf0; --sand:#d8c49a; --yellow:#f2d54b;
  --f-disp:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--dim);font-weight:600}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 10px}
#hud .wrap{display:grid;gap:7px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.ident{display:flex;align-items:center;gap:6px 8px;flex:0 1 auto;flex-wrap:wrap;white-space:nowrap}
.htimes{display:inline-flex;gap:10px;flex-wrap:wrap}
.ident .htimes span{font-family:var(--f-mono);font-size:13px;letter-spacing:0;text-transform:none}
.ident .hday{color:var(--cyan)}
.ident .hday .tgm{color:var(--cyan)}.ident .hday .trl{color:var(--amber)}
.ident .hleft{color:var(--red)}
.ident b{white-space:nowrap;font-family:var(--f-disp);font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--amber);line-height:1}
.ident span{font-family:var(--f-disp);font-size:14px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.spd{display:grid;grid-template-columns:44px 44px 1fr 94px;gap:6px;flex-basis:100%;width:100%;margin-left:0}   /* the speed box is as wide as the two buttons on the left, so Pause sits in the middle */
.spd .bsel.off{border-color:var(--line);color:var(--faint)}
.spd>*{min-width:0;height:36px;box-sizing:border-box}
.spd button.flip,.spd button.mus{padding:0;text-align:center}
.spd button{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.spd button.on{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.spd button.mus{font-size:14px;padding:3px 9px;color:var(--faint);text-decoration:line-through}
.spd button.mus.on{color:var(--cyan);border-color:var(--cyan-soft);background:none;text-decoration:none}
.vol{display:grid;grid-template-columns:auto 1fr 34px;gap:10px;align-items:center}
.vol b{font-size:12px;text-align:right;font-weight:500}
.mpanel{background:var(--panel2)}
.spd button.pause{color:var(--fg)}
.spd button.pause.on{background:var(--cyan);border-color:var(--cyan);color:var(--bg)}
.now.paused{border-color:var(--cyan)}
.spd .bsel{display:flex;align-items:stretch;font-family:var(--f-mono);font-size:13px;padding:0;border:1px solid var(--cyan-soft);border-radius:4px;color:var(--cyan)}
.spd .bsel.on{background:var(--cyan);color:var(--bg)}
.spd .bsel select{font:inherit;color:inherit;background:transparent;border:0;padding:0;width:100%;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;cursor:pointer}
.spd .bsel select option{color:var(--fg);background:var(--panel)}
.meter{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:8px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px}
.bar.hp i{background:var(--red)}
.bar.xp i{background:var(--cyan)}
.meter span{font-size:12px;color:var(--fg);min-width:92px;text-align:right}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res>div{display:flex;align-items:baseline;gap:6px;background:var(--panel2);border-radius:4px;padding:5px 8px;min-width:0}
.res b{font-size:15px;font-weight:500}
.res .cap{font-size:11px;color:var(--faint);font-weight:400}
.res b.full{color:var(--amber)}
.res>div{flex-wrap:wrap}
.res small.rt{flex-basis:100%;margin-left:0;color:var(--dim);font-size:11px}
.res small.rt.neg{color:var(--red)}
#t-ratt{white-space:normal;overflow-wrap:anywhere}
.foods{flex-basis:100%;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12.5px;color:var(--fg);font-family:var(--f-mono)}
.foods em{font-style:normal;color:var(--dim)}
.foods span.full{color:var(--amber)}
.foods span i{font-style:normal;color:var(--faint)}
.surv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px}
.surv b{font-size:14px;font-weight:500}
.surv span{color:var(--dim)}
.surv em{font-style:normal;color:var(--dim)}
.surv .plan{flex-basis:100%;color:var(--cyan)}
.surv .plan.over{color:var(--amber)}
.task.rest .tm{border-style:dashed}
.task.train .tm{border-style:dotted}
.mn.train .mb{stroke-dasharray:1 3}
.surv.warn b,.surv.warn em{color:var(--red)}
.tx .tt{color:var(--dim)}
.gtm{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.gtm:disabled{cursor:default}
.gcost{font-size:12px;color:var(--dim);white-space:nowrap;align-self:center}
.eat.rep{border-color:var(--cyan);color:var(--cyan)}
.eat{flex-basis:100%;margin-top:4px;font-size:12px;padding:5px 8px;border:1px solid var(--green);color:var(--green);border-radius:4px;text-align:center}
.eat:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.res .fq{display:block;font-size:11px;color:var(--green);font-family:var(--f-mono);font-weight:400;margin-top:2px}
.res small{font-size:11px;margin-left:auto;white-space:nowrap}
.res small#t-wear{white-space:normal}
.pos{color:var(--green)} .neg{color:var(--red)}
.ngp{border-color:var(--cyan-soft)}
.ngp .h2{color:var(--cyan)}
.bld{margin:-6px 0 10px;font-size:11px;color:var(--faint)}
.ngrow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ngrow>div{flex:1;min-width:0;font-size:13px}
.ngrow small{display:block;color:var(--dim);font-size:11.5px}
.ngrow .btn{width:36px;height:34px;padding:0;font-size:16px}
.hng{font-family:var(--f-mono);font-size:11px;color:var(--cyan);border:1px solid var(--cyan-soft);border-radius:3px;padding:1px 4px}
.now{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;padding:7px 9px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:34px}
.now .nf{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber-fill)}
.now span{position:relative;min-width:0}
#n-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#n-eta{font-size:12px;color:var(--dim);white-space:nowrap}
.now.idle{border-color:var(--amber);animation:blink 1.6s ease-in-out infinite}
.now.forage{border-color:var(--green)}
@keyframes blink{50%{border-color:var(--line)}}

/* main */
main{padding-block:12px 100px}
main .wrap{display:grid;gap:18px}
.view{display:grid;gap:18px}
.view[hidden]{display:none!important}

/* queue */
.qp{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:6px}
.qh{display:flex;justify-content:space-between;align-items:center}
.qh .qeta{color:var(--cyan);letter-spacing:0;text-transform:none;font-weight:400}
.item h3.gready{color:var(--yellow)}
button.secfold{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin-top:10px;font:inherit;cursor:pointer}
button.zhb{display:flex;width:100%;align-items:baseline;justify-content:space-between;gap:8px;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
button.zh.zhb{margin:14px 0 6px}
.tgm{color:var(--cyan)}.te.over,#n-eta.over,#q-eta.over{color:var(--red)}.trl{color:var(--amber)}
.over .tgm,.over .trl,.hleft .tgm,.hleft .trl{color:inherit}   /* over the clone's time, or remaining time: all red */
.secrun{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;margin:4px 0 8px;border:1px solid var(--cyan-soft);border-radius:4px;font-size:12.5px;color:var(--fg)}
.secrun.on{border-color:var(--cyan)}
.secrun.dim{color:var(--dim)}
.secrun .btn{padding:6px 12px;font-size:12.5px;white-space:nowrap}
.secrun.top{width:100%;box-sizing:border-box;margin:0 0 10px;padding:10px 12px;border-width:2px;border-color:var(--cyan);font-size:13.5px}
.secrun.top .btn{padding:9px 18px;font-size:14px}
.secrun.top.dim{border-color:var(--cyan-soft)}
.qrow.srow{border:1px solid var(--cyan);background:var(--cyan-soft)}
.gitem .ta{margin-left:6px}
.chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.chain .cqadd{margin-left:auto;padding:3px 8px;font-size:11.5px}
.chain .lk{color:var(--cyan)} .chain .br{color:var(--faint)}
.chain span.st{padding:2px 6px;border:1px solid var(--line);border-radius:3px}
.chain span.st.ok{border-color:var(--cyan-soft)}
.qnow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid var(--amber);border-radius:4px;font-size:13px}
.qnow .btn{padding:5px 10px;font-size:12px}
.qh button{font-size:12px;color:var(--dim);padding:3px 6px}
.qlist{display:flex;flex-wrap:wrap;gap:6px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.qlist.long{max-height:55vh;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.qrow{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.qrow.blocked{opacity:.6}
.qrow .qn{color:var(--faint);font-family:var(--f-mono);font-size:12px}
.qrow .qt{flex:1;min-width:0}
.qrow.cq{border-color:var(--cyan-soft);align-items:flex-start}
.task.chaincard{border-color:var(--cyan-soft)}
.task.chaincard .tn{color:var(--cyan)}
.task.chaincard .csub{list-style:none;margin:0;padding:6px 12px 10px;display:grid;gap:2px;font-size:12px;color:var(--dim);flex-basis:100%}
.task.chaincard .csub li.done{color:var(--faint);text-decoration:line-through}
.task.chaincard{flex-wrap:wrap}
.copen{font-size:13px}
.qrow.cq .cqt{width:auto;height:auto;border:0;padding:0;color:var(--cyan);font-size:13px;text-align:left}
.qrow .csub{list-style:none;margin:6px 0 2px;padding:0 0 0 4px;display:grid;gap:2px;font-size:12px;color:var(--dim)}
.qrow .csub li.done{color:var(--faint);text-decoration:line-through}
.qrow .csub li.cur{color:var(--fg)}
.qrow small{color:var(--dim);font-size:11px}
.qrow button{width:28px;height:30px;flex:0 0 auto;border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:14px}
.qrow button:disabled{opacity:.3;cursor:default}
.qrow .qdrag{flex:0 0 auto;width:22px;height:30px;margin-left:-4px;display:grid;place-items:center;color:var(--faint);font-size:18px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.qrow.dragging{position:relative;z-index:5;border-color:var(--amber);background:var(--panel);box-shadow:0 6px 16px rgba(0,0,0,.45);transition:none}
.qlist.dragmode .qrow:not(.dragging){transition:transform .12s ease}
.qlist.dragmode{user-select:none;-webkit-user-select:none}
.qh .qhb button{font-size:12px;color:var(--dim);padding:3px 6px}
.qh .qhb button.qclear{color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12.5px}
.qh .qhb button.qclear:hover{border-color:var(--red);color:var(--red)}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.qmain{min-width:0;display:grid;gap:6px}
.qpre{display:grid;gap:6px;padding-left:10px;border-left:1px dashed var(--line)}
.qps{display:grid;gap:3px;font-size:12px}
.qpl{display:flex;gap:6px;align-items:baseline}
.qpb{display:flex;gap:4px}
.qps b{font-family:var(--f-mono);color:var(--amber)}
.qps small{color:var(--dim);font-size:11px}
.qps button{font-size:11px;padding:4px 7px;border:1px solid var(--line);border-radius:4px;color:var(--fg)}
.qps button:disabled{opacity:.35;cursor:default}
.qkeep p{font-size:12px}
.lockq{visibility:visible!important}
.qnote{font-size:12px;color:var(--dim)}
.qnote b{color:var(--fg);font-weight:500}

/* zones and tasks */
.zone{display:grid;gap:6px}
.zh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:5px}
.zh h2{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.zh span{font-size:12px;color:var(--dim)}
.zh em{margin-left:auto;font-style:normal;font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.sub{font-family:var(--f-disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.task{display:flex;gap:6px;align-items:stretch}
.tm{position:relative;flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:5px;padding:9px 10px;overflow:hidden;background:var(--panel)}
.tm .tf{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber-soft);pointer-events:none}
.tm>div{position:relative}
.th{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tn{font-weight:500;font-size:14.5px;min-width:0}
.te{font-size:12px;color:var(--dim);white-space:nowrap}
.tx{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:5px;align-items:center;font-size:12px;color:var(--dim)}
.haz{color:var(--red)}
.star{color:var(--amber)}
.task.job .tm{background:var(--panel2)}
.task.on .tm{border-color:var(--amber)}
.task.job .tm .tf{background:var(--amber-soft)}
.task.job:not(.on) .tm .tf{opacity:.45}
.tf.fast,.nf.fast{width:100%!important;opacity:.75;background:linear-gradient(90deg,var(--amber-soft),var(--amber-fill),var(--amber-soft))!important}
.task.fb .tn::after{content:" · fallback";color:var(--faint);font-size:11px;font-weight:400}
.tq{flex:0 0 44px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:18px;color:var(--dim)}
.side{display:flex;flex-direction:column;gap:4px;flex:0 0 52px}
.side .tq{flex:1 1 auto;min-height:36px}
.ta{flex:0 0 52px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);padding:6px 0}
.side .ta{flex:0 0 auto}
.ta.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.prio{display:grid;gap:8px;padding:10px;margin-top:-2px;border:1px solid var(--amber);border-radius:5px;background:var(--panel2);font-size:12px;color:var(--dim)}
.prio b{color:var(--fg);font-weight:500}
.prio-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.prio-btns button{font-family:var(--f-mono);font-size:14px;padding:8px 0;border:1px solid var(--line);border-radius:4px;color:var(--fg)}
.prio-btns button.on{background:var(--amber);border-color:var(--amber);color:var(--bg)}
.tq.in{color:var(--amber);border-color:var(--amber);font-size:12px}
.task.lock .tm{opacity:.45;cursor:default;border-style:dashed}
.task.lock .tq{visibility:hidden}

/* skills */
.sk.fam h3{font-family:var(--f-body);font-size:14px;text-transform:none;letter-spacing:0;font-weight:500}
.sk{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}
.skh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.skh h3{margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.skh b{font-family:var(--f-mono);font-size:16px;font-weight:500}
.skm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.note{font-size:13px;color:var(--dim);max-width:62ch;margin:0}
.panel{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:4px;background:var(--panel)}
.h2{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* gear */
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item>div{flex:1;min-width:0}
.item h3{margin:0;font-size:14.5px;font-weight:500}
.item p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.buy{font-family:var(--f-mono);font-size:12px;padding:8px 10px;border-radius:4px;border:1px solid var(--amber);color:var(--amber);white-space:nowrap;min-width:84px}
.tq small{display:block;font-size:10px;line-height:1;opacity:.8}
.gqb{flex:0 0 auto;width:40px;height:40px;margin-left:6px}
.item.lockd h3{color:var(--dim)}
.buy:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.owned{font-family:var(--f-mono);font-size:12px;color:var(--green);min-width:84px;text-align:center}

/* archive */
.perk{padding:9px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.perk h3{margin:0;font-size:14px;font-weight:500;color:var(--amber)}
.perk p{margin:0;font-size:12px;color:var(--dim)}
.perk .by{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.perk.no h3{color:var(--faint)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--panel2);border-radius:4px;padding:8px}
.stats b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px}
.stats span{font-size:11px;color:var(--dim)}
.set{display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row p{margin:0;font-size:13px}
.row small{display:block;color:var(--dim);font-size:12px}
.tog{width:46px;height:26px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .15s}
.tog.on{background:var(--amber-fill);border-color:var(--amber)}
.tog.on::after{transform:translateX(20px);background:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber)}
.btn{font-size:13px;padding:9px 12px;border-radius:5px;border:1px solid var(--line);color:var(--fg)}

<script id="logic">
// Renamed from Long Patience: move this device's old storage keys to the new 'selene.' names once
try { const old = []; for (let n = 0; n < localStorage.length; n++) old.push(localStorage.key(n)); old.forEach(k => { if (k && k.indexOf('long-patience.') === 0) { const nk = 'selene.' + k.slice(14); if (localStorage.getItem(nk) == null) localStorage.setItem(nk, localStorage.getItem(k)); localStorage.removeItem(k); } }); } catch(e) {}
/* ===== Game data and rules (no DOM) ===== */
const BUILD = '2026-11-04 · hidden records';   // shown in the main menu, to tell which version is loaded
const DPS = 8;             // simulation ticks per real second at 1x (doubled for the test version: same balance, half the real time)
// Time is simulated in ticks. 80 ticks make one day unit (18 minutes each), so a day lasts
// 20 real seconds at 1x and Players only ever see in-game time and real time, never days.
const TPD = 80;
const JOB_CYCLE = 8;       // in-game days of base work per job batch
const MEAL_CD = 40;        // ticks between recharges: one recharge per cooldown
const HUNGER = 0.15;       // base health lost per tick, always, while time runs
// Strain: the body wears down. The hunger drain is multiplied by strain, which climbs
// (The fault is gone: energy drain no longer grows over a seedling's life.)
const MAX_DRAIN = 1.2;     // most health a young seedling can lose per tick (the cap grows with age, see drainNow)
// Difficulty: the drain cap doubles every CAP_DOUBLE day units (10 s in-game each) of a seedling's life, so strain always wins in
// the end (good feeding buys time, not immortality); and each section is a little more dangerous than the
// one before (hunger and hazards x DANGER), with a step up at the start of Act II.
const CAP_DOUBLE = 30;
const DANGER = {1:1.0, 2:1.05, 15:1.075, 3:1.1, 4:1.15, 5:1.2, 9:2.12, 10:2.18, 11:2.24, 12:2.3, 6:2.36, 7:2.42, 8:2.48, 16:2.51, 13:2.54, 14:2.6};   // Act II by route: the long watch, the Boarders (The Mending slotted in), Arrival
const danger = z => DANGER[z] || 1;
function drainNow(haz, wear, z){ const k = danger(z); return Math.min((HUNGER + (haz || 0)) * k, MAX_DRAIN * k) * DRAIN_X * (1 - Math.min(0.9, (M && M.stasis) || 0)) / drainDiv() / vitDiv(); }   // stasis tuning (watch records) cuts the drain
const DRAIN_X = 3.2;   // overall energy drain (with the fault gone, energy alone limits a seedling)
// Efficiency optimization: every seedling's survival makes later seedlings drain more slowly (at the cap: drain / (1 + VIT_K))
const VIT_K = 0.6;
const vitDiv = () => 1 + VIT_K * Math.min(BASE_HP_MAX - 100, (S && S.vit) || 0) / (BASE_HP_MAX - 100);
// A recharge restores the hunger of one cooldown plus the old resting regeneration.
// Food deeper in the ship is better: each section past the first makes recharges restore 12% more.
// Food: one ration store until the long watch. Every charging station fills it. How much a ration heals
// depends on the best kitchen this seedling has fixed: each section has one upgrade action (see MEAL_UP),
// done again every life. The store grows as the seedling gets deeper into the ship (STORE_CAP), plus gear.
// One food: cells. (The long watch's beds, seed stores and protein tanks are grown for the waking crew;
// seedlings only eat the thinnings, culls and skim, as cells.)
const FOODS = [
  {id:'ration',  z:1,  name:'Sap cells',           q:1,   cap:5,  job:null},
];
const FD = {}; FOODS.forEach(f => FD[f.id] = f);
const FOOD_OF = {}; for (let z = 1; z <= 16; z++) FOOD_OF[z] = 'ration';
// Energy pressure: each crossing costs a share of the cells carried (Supply manifests halve it), and each
// section's charging station holds a limited reserve per seedling life (its charger upgrade adds half again).
// Share of the cells carried that a crossing into section z costs (by section id: the Shattered Bark, id 15, sits after the Taproot Galleries)
const CROSS_COST = {1:0.08, 2:0.08, 15:0.095, 3:0.11, 4:0.14, 5:0.17, 9:0.2, 10:0.23, 11:0.26, 12:0.29, 6:0.32, 7:0.35, 8:0.38, 16:0.395, 13:0.41, 14:0.44};
const crossCost = z => Math.min(0.45, CROSS_COST[z] || 0.08) * ((M && M.crossCost) || 1);
const RESERVE_K = 0.15;   // share of an untrained seedling's recharges for the whole section that its station holds
const SEC_TICKS = {};
function stationMax(z){
  if (SEC_TICKS[z] == null) SEC_TICKS[z] = TASKS.filter(t => t.z === z && t.kind === 'act' && !t.legacy).reduce((a, t) => a + t.days * (t.reps || 1), 0);
  const up = TASKS.find(t => t.z === z && t.meal);
  return Math.max(z === 1 ? 15 : 10, 5 * Math.round(RESERVE_K * (isA2(z) ? 0.5 : 1) * SEC_TICKS[z] / MEAL_CD / 5)) * (up && isDone(up.id) ? 1.5 : 1) * ((M && M.stationRes) || 1);
}
const stationLeft = z => Math.max(0, stationMax(z) - ((S.life.used || {})[z] || 0));
const STORE_CAP = {1:5, 2:20, 15:25, 3:35, 4:60, 5:90, 6:25, 7:25, 8:30, 9:25, 10:25, 11:30, 12:30, 16:30, 13:30, 14:35}   // store sizes and increases come in steps of 5;
// The section upgrade actions and the ration strength each one brings (kept for the rest of the life)
const MEAL_UP = {heatpaste:1.27, strains:1.54, barkcharger:1.7, packer:1.85, ovens:2.17, pantryfix:2.48, graft:2.55, sprout:2.62, darkmess:2.7, burnmess:2.8, mess:3.07, synthfix:3.2, hivegel:3.34, mendcharger:3.4, sysmess:3.45, feast:3.55};   // Act II in route order
const REPAIR_UP = {ws9:1.15, ws10:1.3, ws11:1.45, ws12:1.6, ws6:1.75, ws7:1.9, ws8:2.05, ws16:2.2, ws13:2.35, ws14:2.5};   // workshops in route order
function repairTier(){ const L = S && S.life; let q = 1; if (L) for (const id in REPAIR_UP) if (L.done && L.done[id]) q = Math.max(q, REPAIR_UP[id]); return q; }
function mealTier(){ const L = S && S.life; let q = 1; if (L) for (const id in MEAL_UP) if (L.done && L.done[id]) q = Math.max(q, MEAL_UP[id]); return q; }
const jobFood = t => !(t && t.prod && t.prod.rations) ? null : (FOODS.find(f => f.job === t.id) || FD.ration).id;

function wrap2(txt, max){

  w.forEach(x => { const l = lines[lines.length - 1]; if ((l + ' ' + x).trim().length > max && lines.length < 2 && l) lines.push(x); else lines[lines.length - 1] = (l + ' ' + x).trim(); });

    const nodes = TASKS.filter(t => t.kind !== 'job' && t.z === z.id && ever[t.id] && legacyOpen(t));   // unrevealed legacy themes stay off the map
    if (!nodes.length) return;
    any = true;
    const ids = new Set(nodes.map(t => t.id)), depth = {};
    // depth by everything an action really needs in this section, mapped or not, so a legacy final sits
    // above the crossing even before its earlier steps are on the map
    const dOf = t => { if (depth[t.id] != null) return depth[t.id]; let d = 0; t.req.forEach(r => { if (T[r] && T[r].z === z.id) d = Math.max(d, dOf(T[r]) + 1); }); return depth[t.id] = d; };

    const byD = {};

    const rows = [];   // empty levels skipped; at most MAP_ROW boxes per row so names stay readable
    Object.keys(byD).map(Number).sort((a, b) => a - b).forEach(d => { const r = byD[d]; for (let i = 0; i < r.length; i += MAP_ROW) rows.push(r.slice(i, i + MAP_ROW)); });
    const pos = {};

      const n = row.length, gap = 8, w = (MW - PAD * 2 - gap * (n - 1)) / n;

      boxes += `<g class="mn${t.kind === 'train' ? ' train' : ''}" data-mapdo="${t.id}" transform="translate(${p.x} ${p.y})">

  if (key === autoKey) return; autoKey = key;
  let h = `<div class="panel"><span class="h2">Automation</span><p class="note">Tasks finished often enough can run by themselves (${autoScale() < 1 ? 'this run needs ' + Math.round(autoScale() * 100) + '% of' : ''} 10 lives' worth: an action 10 times, a training session 40 times), and gear built in ${AUTO_LIVES} lives can be built automatically (in ship order; the seedling saves up for the next one). Switch them on here. They run in chain order: each after the tasks it needs. Linked tasks form chains, and a fully chained section can be run with one click. Automated tasks run ahead of your queue; automated crossings wait until the queue is done.</p>
    ${foodSettingsHtml()}${partsSettingsHtml()}

</div>`;
  if (!list.length && !glist.length && !plist.length && !pglist.length) {

    // section chain status, and the chains formed so far (links need both tasks automated and x2 familiar)

    h += z.id === (L.sec || 1) ? secRunHtml(z.id) || `<div class="secrun dim"><span>Section chain: ${g.ok}/${g.n} parts ready.</span></div>` : `<div class="secrun dim"><span>Section chain: ${g.ok}/${g.n} parts ready${g.ready ? ' (ready)' : ''}.</span></div>`;
    const missing = sectionTasks(z.id).filter(t => !(isAuto(t) && masteryF(t) >= SECTION_F)).map(t => t.name).concat(sectionGear(z.id).filter(i => !gearAuto(i)).map(i => i.name));
    if (missing.length && missing.length <= 8) h += `<p class="note">Still needed for the one-click section: ${esc(missing.join(', '))}.</p>`;

    chainsOf(z.id).forEach(c => {

        <button class="tog${on ? ' on' : ''}" data-gauto="${i.id}" aria-pressed="${on}" aria-label="Build ${esc(i.name)} automatically"></button>

    if (pl.length || pg.length) h += '<div class="sub asub">Not yet automatable</div>';
    pl.forEach(t => { h += `<div class="arow pend"><div class="an"><b>${esc(t.name)}</b><span>${KIND_LABEL[t.kind]} \u00b7 auto ${S.prac[t.id] || 0}/${autoNeed(t)} ${t.kind === 'train' ? 'sessions' : 'finishes'}</span></div><span class="pp num"><span class="paut">${pctTxt(autoFrac(t))}</span></span></div>`; });
    pg.forEach(i => { h += `<div class="arow pend"><div class="an"><b>${esc(i.name)}</b><span>Gear \u00b7 built in ${(S.gprac || {})[i.id] || 0}/${gearNeed(i)} lives</span></div><span class="pp num"><span class="paut">${pctTxt(gearAutoFrac(i))}</span></span></div>`; });
    h += '</div></section>';

/* ----- FAQ ----- */
const FAQ_ALL = [
  ['Selene and the Root-Kin', 'The Root-Kin of Earth grow their technology: tools, cities, vehicles and ships come from specialised trees, hardened with magic. It is a highly advanced techno-magical civilisation, and everything in it is organic. There are no nation states left, but the local cultures are kept alive. One World Government has ruled for thousands of years: a democracy with slight meritocratic elements. <b>Selene</b> is one of their colony ships: a long, swept hull of living wood with crescent wings, grown around the <b>Hearth Tree</b>, which is her drive, her mind (WARDEN) and her garden at once. Root-Kin ships ride the ambient magic that saturates the universe, close to the speed of light, inside magical ward-shields and under artificial gravity, and can turn on any axis without strain. That is why, halfway there, Selene has to <b>flip</b> and brake for the rest of the voyage. Seedlings like K-7 are disposable drones of WARDEN and the Hearth Tree, grown for a single task and given just enough autonomy to carry it out.'],
  ['What is the goal?', 'Restore Selene so WARDEN can wake the sleeping crew. All of Act I happens inside the Hearth Tree, her drive, mind and garden at once: the sap flow that powers her in the Taproot Galleries, the meteor wounds in her hull in the Shattered Bark, WARDEN\u2019s mind and the star-charts in the Heartwood, the food gardens in the Canopy Gardens, and the Hearthfire in the Ember Crown. Act I ends when you kindle the Hearth Tree. One seedling cannot do it all; it takes many lives (around 50 with very good play).'],
  ['How do I start?', 'Tap a task to work on it right away. Climb out of the seed pod first, then tap the vault\u2019s sap line for sap cells and strip dead bark panels for deadwood. Time only moves while your seedling is working: with nothing to do, the clock stops, so you can always read and plan.'],
  ['What are jobs, actions and training?', '<b>Jobs</b> repeat and make sap cells or deadwood in batches; they stop when that storage is full. <b>Actions</b> are one-off tasks that unlock things and move the story on. Each needs certain earlier actions, and a section\u2019s last action (its crossing) needs every other action of that section. Tasks you have met before stay listed, greyed out, until what they need is done; you can still queue them. <b>Drills</b> each add a little familiarity to every task in their section, up to 4 sessions per life.'],
  ['How does the queue work?', 'Tapping a task runs it right away, ahead of the queue (a job runs until its store is full); it is not added to the queue. Tapping a gear card works the same way: it is built right away, after gathering the deadwood (grafts in Act II) it still needs. <b>+</b> adds a task to the end of the queue; drag it or use the arrows to move it up. You can queue the same task several times at different places: tap + again for another copy. A task queued once runs until it is done; with several copies, each copy covers one repetition (one training session, one rep, or one fill of a store). The queue holds up to 100 items. Drag an item by the handle on its left to move it, or use the arrows; ✕ removes it. Queued jobs run until their storage is full. You can queue things you have seen before even if they are not available yet; they wait their turn. Gear can be queued too, with the <b>+</b> on its card (gear is listed in each section of the Tasks tab): the seedling works the best deadwood job until it can afford the design, then builds it. Five presets save and load whole queues, and <b>Keep queue between seedlings</b> gives each new seedling the queue you planned, minus anything that is automated and switched on.'],
  ['Energy and sap cells', 'Seedlings are biomechanical: as long as they have energy, the body is sustained. The <b>Energy</b> bar drains all the time; each recharge uses one <b>sap cell</b> and puts energy back. <b>Every recharge restores the same amount</b>; what changes is how often the seedling can recharge. Sap cells are carried up to the seedling\u2019s <b>storage capacity</b>, which grows as the seedling gets deeper into the ship (5 in the Seedling Vaults, up to 90 in the Ember Crown, in steps of 5), plus gear and records. Each section has a <b>charging station</b> job, but it only opens partway into the section and holds a limited <b>reserve</b> per seedling life; when it is drained, the seedling has to cross or run down. Every crossing also costs a share of the cells carried, more the further into the ship you go, so a seedling always arrives living on what it brought. At first a seedling can recharge every 5 seconds of in-game time. Each section has one <b>charger upgrade</b> action that shortens the wait between recharges for the rest of that life, down to about 2 seconds, and adds half again to that section\u2019s station reserve; each seedling has to fix them again. Recharges are always whole, and the seedling only recharges when it needs to: when a whole recharge fits under full energy, or sooner once energy is down to half. At full energy no cell is used. With no cells left at all, the seedling runs down. The Hive Ship\u2019s only charging comes late, so arrive charged.'],
  ['What carries over when a seedling dies?', '<b>Familiarity</b> is kept: every task stays as fast as your seedlings have made it (see the Mastery tab). Every 10 seconds of in-game time a seedling survives is analysed afterwards, run and memory alike, and becomes an <b>efficiency patch</b>: later seedlings drain their energy a little more slowly, up to \u00f71.6. <b>Archive records</b> found by finishing certain actions are permanent upgrades. Gear, sap cells, deadwood and progress through the ship reset.'],
  ['What are sections?', 'Act I is split into six sections. A <b>red</b> action leads to the next one, and the way back is sealed for that seedling, so finish what you need first (records, training, gear). Each new seedling starts back in the Seedling Vaults.'],
  ['What is gear?', 'Gear is built from deadwood (called grafts in Act II: the same store) and lasts for one seedling. Each section has designs to build. Building one pays its deadwood up front, then the seedling spends time <b>assembling</b> it (bigger designs take longer, from a moment for a toolkit to half a minute or so of in-game time for the largest); assembly comes before other work and gets faster with familiarity. The gear works once it is assembled. Deadwood storage is limited; opening up more of the ship raises it.'],
  ['What is familiarity?', 'There are no skills: each task gets faster on its own the more of it your seedlings have done. Familiarity counts work in completions, including attempts a seedling died in the middle of, and is kept between seedlings. Speed rises smoothly from ×1 to ×10 once you have done enough of a task: in a first run, 90 lives’ worth of it (90 finishes of an action, 1800 batches of a job). Each level of the <b>Echo</b> legacy theme lowers that for Act I tasks. Familiar tasks also hurt less (hazard damage up to ÷4), and a familiar charging station charges faster. <b>Drills</b> spread familiarity to every task in their section. The Mastery tab lists every task.'],
  ['How does automation work?', 'Every completion counts: finish an action 10 times (a multi-rep action 10 times its reps), or a training session 40 times, or build a design in 10 lives, and its automation <b>switches on by itself</b>. For Act I tasks these counts shrink along with the familiarity threshold (Echo legacy), never below one; tap <b>AUTO</b> (or its switch in the Auto tab) to turn it off, and it stays off. Automated tasks run by themselves <b>ahead of your queue</b>, in chain order (each after the tasks it needs). Automated tasks <b>link into chains</b> when one requires the other and both are at least ×2 familiar. When every action and crossing of a section is automated and ×5 familiar, and all its gear designs are automated, the whole section becomes <b>one chain</b>: press <b>▶ Run section</b> (above the queue in the Tasks tab) and the seedling works through everything, builds the gear, fills its stores and crosses. The run is pinned at the top of the queue and the queue\u2019s leftovers for its sections are cleared. Pressing it also turns on <b>Always run sections once ready</b> (Auto tab): from then on a run starts by itself whenever the section you are in is ready. Stop turns that off again. Ready sections next to each other link across their crossings into one run (<b>▶ Run 3 sections</b>), up to the end of the act; a run that dies starts again with the next seedling. The option <b>Pause when a section run ends instead</b> keeps a run going through its crossings and pauses once it is over. A chain picks its next step itself each time: gear first, then charger upgrades, then the actions and drills in the order they depend on each other, and the crossing last. When a chain forms or grows, it <b>queues itself</b>, including the chains of sections still ahead, and chain entries are kept in the order they will run: section by section, and within a section the chain that starts earliest first, with the crossing\u2019s chain last, and anything of it you had queued separately is dropped from the queue. If you remove a chain from the queue, it stays out for the rest of that seedling\u2019s life. Work done as part of a chain (a queued chain or a section run) builds <b>chain flow</b>, which makes chained steps up to five times as fast; it is kept for good. Jobs are never automated: auto-forage keeps the charge up, queued and automated gear work the deadwood jobs, and every crossing tops the stores up before the seedling moves on. An automated <b>deadwood</b> job only gathers what gear needs: the next auto-built or queued design that is found and not built yet; it does not top the store up to full (except while filling up before a crossing). Automated <b>crossings</b> are the exception: they wait until your queue is done. A task you tap runs before everything. The <b>Auto</b> tab lists everything unlocked and has extra options: charging when needed, the death screen and starting paused.'],
  ['What happens at a crossing with automation?', 'A queued or automated crossing stops just before it finishes and waits while the seedling finishes automated actions and training, builds affordable automated gear and refills storage (if that option is on). Tap a crossing yourself to go at once.'],
  ['Pause, saving and speed', 'Progress is saved on this device only (this browser or the app); use <b>Save files</b> in the main menu (\u2630) to back it up or move it, and <b>Restart</b> next to the slot there to start this slot over. Pause with the button at the top or the space bar. The game only runs while it is on screen: in another app, a background tab or closed, the clock stops and carries on where it left off. Each <b>Stasis watch</b> record (one for leaving each section the first time) tunes the seedlings\u2019 stasis: energy drains a little slower, more with each one, up to \u221250% in all. The <b>speed menu</b> (\u00bb) at the top appears once Act I has been cleared: \u00d72 then, and \u00d75 once Act II has been cleared. It is a flat speed-up of real time, kept on this device for every save.'],
  ['Save management', 'The game saves itself every few seconds on this device. <b>Save Management</b> in the \u2630 menu holds: the five <b>save slots</b> (give each a name when you start a new game or save into it, or with <b>Rename</b>; load one, copy your current game into another as a save state with \u201cSave here\u201d, or delete one); under each used slot, its <b>death save</b>, written automatically at every death in that slot (load it to go back to that death; playing it never changes the regular slot. If it is too far gone, load the regular slot again from there, which deletes that death save. Deleting or starting over a slot removes its death save too); <b>Restart</b>, next to the slot you are playing, which starts that slot over; and <b>Save files and transfer</b>: export a save file, import one, copy the save as text to move it between devices, or share it to the game\u2019s GitHub folder and load shared saves from there.'],
  ['Settings', '<b>Settings</b> (the ⚙ button, or Settings in the ☰ menu) holds the clock and pause options (death screen, starting paused, after a new section, when a section run ends or when a task finishes), sound (music and effects), layout (vertical or horizontal) and, in the Android app, app updates. Energy and automation options (auto-recharge, auto-charge, the charge threshold, charging when needed) are in the Auto tab.'],
];

const FAQ_NGP = ['Legacy tasks', 'There is no restarting: after the Hearth Tree is kindled, the story always moves forward. As Act II unfolds, <b>legacy tasks</b> open up in Act I, one theme at a time. Each theme adds a set of five parts to every Act I section, open once a seedling has done that section\u2019s last regular action: two pairs of steps, then a <b>final</b> that needs both pairs. Revealed sets are <b>needed for the crossing</b> (and for kindling the Hearth Tree). Finishing a final gives its bonus for the rest of that life, growing with the final\u2019s mastery (nothing untrained, full share at twice the usual familiarity). All six finals of a theme (one per Act I section), done and mastered, give its full effect. Each set has an optional <b>drill</b> that trains only its five parts; section drills don\u2019t train them. Legacy parts are never queued for you: a toast and a dot on the Tasks tab say when they open up. Once automated they join chains and section runs like any other task. The <b>Legacy</b> tab shows what each revealed theme does and how far it has got. Kindling the Hearth Tree the first time also unlocks the <b>Quartermaster\u2019s cache</b>: every seedling starts with all of its automated gear already built, in both acts.'];
const FAQ_WEAR = ['Ship wear and grafts', 'In Act II Selene wears out as your seedlings work: least early in the long watch, more against the Boarders, most during Arrival. Every point of wear adds 8% to the energy drain. <b>Deadwood</b> doubles as <b>grafts</b>: a <b>repair</b> takes off 1.5 wear for a fixed number of grafts (more in later sections), then needs a cooldown, like a recharge. <b>Auto-repair</b> does this for you; the <b>Repair</b> button under Grafts does it by hand. Graft jobs are to grafts what charging stations are to energy: <b>Auto-scavenge</b> works the best one when grafts run low. Each Act II section has a <b>workshop</b> action that makes repairs come more often; it costs three repairs\u2019 worth of grafts when work on it starts. Run out of grafts and the wear keeps climbing until the seedling is worn down with her.'];
const FAQ_A2 = ['Act II', 'Once the Hearth Tree is kindled, every seedling that kindles it carries on into <b>Act II</b>: nine more sections, one after another, each revealed when a seedling first reaches it. Act II tasks have their own familiarity, which Echo legacy tasks reduce only at 10% strength: it starts at 90 lives\u2019 worth for \u00d710 and drops by a quarter at each of Act II\u2019s three big milestones. Act II familiarity, automation and records are kept for good.'];
let faqDone = '';
// The FAQ unfolds as the game does. Unlocks are kept on the device (not in a save), so a new game keeps them;
// loading a save also unlocks whatever that save has reached. 'new' marks entries not opened yet.
const FAQ_KEY = 'selene.faq.v1';
const FAQ_GATE = {'Selene and the Root-Kin':'start', 'What is the goal?':'start', 'How do I start?':'start', 'What are jobs, actions and training?':'start',
  'Energy and sap cells':'start', 'Pause, saving and speed':'start', 'How does the queue work?':'queue',
  'What carries over when a seedling dies?':'death', 'What is familiarity?':'death', 'Save management':'death', 'Settings':'death',
  'What is gear?':'gear', 'What are sections?':'sections', 'How does automation work?':'auto', 'What happens at a crossing with automation?':'auto',
  'Legacy tasks':'won', 'Act II':'a2', 'Ship wear and grafts':'a2'};
const FAQ_TEST = {
  start: () => true,
  queue: () => S.life.queue.length > 0 || (S.life.qdone || []).length > 0 || S.gen > 1,
  death: () => (S.stats.deaths || 0) > 0,
  gear: () => ITEMS.some(i => (S.ever || {})[i.req] || isDone(i.req)) || Object.keys(S.gprac || {}).length > 0,
  sections: () => (S.life.sec || 1) > 1 || Object.keys(S.life.visited || {}).length > 1 || !!(S.firstAt && S.firstAt[2]),
  auto: () => TASKS.some(t => t.kind !== 'job' && practiced(t)) || ITEMS.some(gearPracticed),
  won: () => !!S.won,
  a2: () => !!(S.a2 && S.a2.open),
};
let faqState = null, faqCheckT = 0;
function faqLoad(){
  if (faqState) return faqState;
  let st = null; try { st = JSON.parse(localStorage.getItem(FAQ_KEY) || 'null'); } catch(e) {}
  faqState = st && st.u ? st : {u:{start:1}, seen:{}, fresh:!st};
  return faqState;
}
function faqSave(){ try { localStorage.setItem(FAQ_KEY, JSON.stringify({u:faqState.u, seen:faqState.seen})); } catch(e) {} }
const faqAll = () => FAQ_ALL.concat([FAQ_NGP, FAQ_A2, FAQ_WEAR]);
function faqCheck(force){
  if (!S || (!force && Date.now() - faqCheckT < 2000)) return; faqCheckT = Date.now();
  const st = faqLoad(); let changed = false;
  for (const k in FAQ_TEST) if (!st.u[k] && FAQ_TEST[k]()) { st.u[k] = 1; changed = true; }
  if (st.fresh) { faqAll().forEach(([q]) => { if (st.u[FAQ_GATE[q] || 'start']) st.seen[q] = 1; }); st.fresh = false; changed = true; }   // first run of this feature: nothing already unlocked counts as new
  faqAll().forEach(([q]) => { if ((FAQ_GATE[q] || 'start') === 'start' && !st.seen[q]) { st.seen[q] = 1; changed = true; } });
  if (changed) { faqSave(); faqDone = ''; }
}
const faqNew = () => { const st = faqLoad(); return faqAll().some(([q]) => st.u[FAQ_GATE[q] || 'start'] && !st.seen[q]); };
function renderFaq(){
  faqCheck(true);
  const st = faqLoad(), k = JSON.stringify(st.u) + Object.keys(st.seen).length;
  if (faqDone === k) return; faqDone = k;
  const list = faqAll().filter(([q]) => st.u[FAQ_GATE[q] || 'start']);
  const firstNew = list.findIndex(([q]) => !st.seen[q]);
  $('#v-faq').innerHTML = '<div class="panel"><span class="h2">FAQ</span><p class="note">How Selene: Tidelocked works. Tap a question to open it. New questions appear as you get further.</p></div><div class="faq">' +
    list.map(([q, a], i) => `<details data-faq="${esc(q)}"${i === firstNew ? ' open' : ''}><summary>${q}${st.seen[q] ? '' : ' <span class="fnew">new</span>'}</summary><p>${a}</p></details>`).join('') + '</div>';
  if (firstNew >= 0) faqSeen(list[firstNew][0], true);
}
function faqSeen(q, keepTag){ const st = faqLoad(); if (st.seen[q]) return; st.seen[q] = 1; faqSave(); if (!keepTag) faqDone = ''; }
document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.faq && d.open) { faqSeen(d.dataset.faq, true); const t = d.querySelector('.fnew'); if (t) t.remove(); } }, true);

/* ----- loop ----- */
let last = performance.now(), saveT = 0, viewT = 0;
// The game keeps running when the tab is hidden: a slow timer keeps ticking, and any gap
// (tab throttled, phone asleep) is simulated in one go when the page gets time again.
// The clock only runs while the game is on screen (no away time).

function simulate(dt){
  if (dt <= 0 || S.life.dead || paused || S.set.paused) return;
  const mult = gameSpeed() * ngpSpeed();
  let left = dt * DPS * mult, done = 0;
  const total = left, perTick = dt / left;
  while (left > 1e-9 && !S.life.dead) {
    const chunk = Math.min(left, 900), d0 = S.life.day;
    advance(chunk);
    const ran = S.life.day - d0;
    done += Math.max(0, ran);
    if (ran > 0) { S.life.real = (S.life.real || 0) + ran * perTick; S.stats.played = (S.stats.played || 0) + ran * perTick; }   // real seconds the clock actually ran
    if (ran < chunk - 1e-6) break;   // stopped: idle, paused or dead
    left -= chunk;
  }
}
function tick(now){
  let dt = (now - last) / 1000; last = now;
  if (document.hidden) dt = 0; else if (dt > 1) dt = 1;   // no away time: the game only runs while it is on screen
  simulate(dt);
  if (pendingDecant) { autoDecant(); simulate(0); }
  saveT += dt;
  if (saveT > 5) { saveT = 0; save(); unlockSpeeds(); }
  return dt;
}
function frame(now){
  const dt = tick(now);
  updateHud();
  viewT += dt;
  if (tab === 'tasks') { renderTasks(); updateTasks(); }
  if (tab === 'map') { renderMap(); updateMap(); }
  if (viewT > 0.4) { viewT = 0; renderView(); }
  requestAnimationFrame(frame);
}
// No away time: the clock stops whenever the game is not on screen and carries on where it left off.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { save(); return; }
  last = performance.now();
});

function myBuild(){ try { return AndroidBridge.versionCode(); } catch(e) { return 0; } }
function setUpd(msg){ updStatus = msg; const el = document.getElementById('upd-st'); if (el) el.textContent = msg; }
function checkAppUpdate(manual){
  if (!inApp()) return;
  const mine = myBuild();
  if (manual) setUpd('Checking GitHub\u2026');
  fetch('https://api.github.com/repos/hufle-beep/long-patience/releases/tags/android-latest', {cache:'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => {
      const m = j && j.name && j.name.match(/build (\d+)/);
      if (!m) { setUpd('No app build found on GitHub.'); return; }
      appUpdate = {build:+m[1], mine};
      if (appUpdate.build > mine) {
        setUpd('Build ' + appUpdate.build + ' is available (you have ' + mine + ').');
        if (!manual && UPD.autoInstall) startAppUpdate();
        else if (!manual) toast('App update available: build ' + appUpdate.build + '. Install it from Settings.', true);
      } else setUpd('You have the latest build (' + mine + ').');
      refreshSettings();
    }).catch(() => { if (manual) setUpd('Couldn\u2019t reach GitHub. Check your connection.'); });
}
function startAppUpdate(){
  if (!inApp() || updBusy) return;
  if (!(AndroidBridge.downloadUpdate)) { setUpd('This app build can\u2019t self-update. Download the new version from the link below once.'); return; }
  updBusy = true; save(); setUpd('Downloading\u2026');
  AndroidBridge.downloadUpdate(APK_URL);
}
// Called by the Android app while downloading and installing
let updTries = 0;
window.onAppUpdate = (state, msg) => {
  if (state === 'progress') { setUpd('Downloading\u2026 ' + msg + '%'); return; }
  updBusy = false;
  // a 404 right after a new build is announced: the file is usually still uploading, so try again shortly
  if (state === 'error' && /404/.test(String(msg)) && updTries < 3) { updTries++; setUpd('Build is still uploading, retrying in 30 s (' + updTries + '/3)\u2026'); setTimeout(startAppUpdate, 30000); return; }
  updTries = 0; setUpd(msg); if (state === 'error') sfx('error');
};
let settingsFrom = null;
function updatePanel(){
  if (!inApp()) return `<div class="panel set"><span class="h2">App updates</span>
    <p class="note">You are playing in a browser, which always has the newest version. The Android app can be downloaded here:</p>
    <p class="note num" style="word-break:break-all;user-select:all">${APK_URL}</p></div>`;
  const avail = appUpdate && appUpdate.build > appUpdate.mine;
  const tg = (k, label, note) => `<div class="row"><p>${label}<small>${note}</small></p><button class="tog${UPD[k] ? ' on' : ''}" data-upd="${k}" aria-label="${label}" aria-pressed="${UPD[k]}"></button></div>`;
  return `<div class="panel set"><span class="h2">App updates</span>
    <p class="note">Installed: build ${myBuild()}${appUpdate ? ' \u00b7 latest on GitHub: build ' + appUpdate.build : ''}. Updates install over this version and keep your saves.</p>
    ${tg('auto', 'Check automatically', 'Look for a new build each time the app starts.')}
    ${tg('autoInstall', 'Install automatically', 'Download a new build as soon as it is found and open the installer. Android still asks you to confirm.')}
    <div class="btns"><button class="btn" data-updcheck>Check now</button><button class="btn pri" data-updinstall ${avail && !updBusy ? '' : 'disabled'}>${avail ? 'Download and install build ' + appUpdate.build : 'Up to date'}</button></div>
    <div class="ghst" id="upd-st" role="status">${esc(updStatus)}</div></div>`;
}
function showSettings(from){
  settingsFrom = from; paused = true;
  showModal(`<h2>Settings</h2><div class="panel set mpanel"><span class="h2">Clock and pauses</span>${pauseSettingsHtml()}</div>${soundPanel().replace('panel set', 'panel set mpanel')}${displayPanel('mpanel')}${updatePanel().replace('panel set', 'panel set mpanel')}${resetPanel()}
    <button class="btn pri" data-settingsclose>${from === 'menu' ? 'Back to menu' : 'Close'}</button>`);
}
// Reset: like a fresh install. 'soft' keeps the save slots; 'full' clears everything the game keeps on this device.
const SOFT_KEYS = ['selene.prefs.v1', 'selene.audio.v1', 'selene.speeds.v1', 'selene.faq.v1', 'selene.layout.v1', 'selene.sharename.v1', 'selene.update.v1'];
function resetPanel(){
  return `<div class="panel set mpanel rpanel"><span class="h2">Reset</span>
    <p class="note">Start over as if the game were newly installed on this device. Shared saves on GitHub and exported files are never touched.${TEST_ALL_SPEEDS ? ' In this test version every game speed stays open either way.' : ''}</p>
    <button class="btn" data-reset="soft">Reset settings and unlocks, keep saves</button>
    <button class="btn warn" data-reset="full">Reset everything (fresh install)</button></div>`;
}
function wipeAndReload(keys){
  wiping = true;
  try {
    const all = []; for (let n = 0; n < localStorage.length; n++) all.push(localStorage.key(n));
    all.forEach(k => { if (k && (keys ? keys.includes(k) : (k.indexOf('selene.') === 0 || k.indexOf('long-patience.') === 0))) localStorage.removeItem(k); });
    sessionStorage.clear();
  } catch(e) {}
  location.reload();
}
// Every save slot and death save in one file (restored by importing it like any save file)
function allSaves(){
  const slots = {};
  for (let i = 1; i <= SLOTS; i++) { const r = readSlot(i), d = readSlot('d' + i); if (r) slots[i] = r; if (d) slots['d' + i] = d; }
  return {seleneAllSaves:1, saved:Date.now(), active:String(slot), slots};
}
function exportAll(){
  save();
  const json = JSON.stringify(allSaves()), name = 'selene-tidelocked-all-saves-' + new Date().toISOString().slice(0, 10) + '.json';
  if (window.AndroidBridge && AndroidBridge.exportFile) { AndroidBridge.exportFile(name, json); return; }
  try {
    const blob = new Blob([json], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Saved ' + name);
  } catch(e) { toast('This browser can’t save files.'); }
}
function askReset(kind){
  const back = () => showSettings(settingsFrom);
  if (kind === 'soft') return askOverwrite('Reset settings and unlocks?', 'Settings, sound, layout, the share name, app-update options, unlocked game speeds and unlocked FAQ entries go back to a fresh install. Your save slots and death saves are kept. The game reloads.',
    [['Reset settings and unlocks', 'warn', () => { save(); wipeAndReload(SOFT_KEYS); }]], back);
  const n = Object.keys(allSaves().slots).length;
  askOverwrite('Reset everything?', 'This erases everything the game keeps on this device: ' + n + ' save' + (n === 1 ? '' : 's') + ' (slots and death saves), all settings and all unlocks, as if the game had just been installed. Export your saves first if you may want them back. This can’t be undone.',
    [['Export all saves first', '', () => { exportAll(); askReset('full'); }],
     ['Erase everything', 'warn', () => askOverwrite('Last check: erase everything?', 'All ' + n + ' save' + (n === 1 ? '' : 's') + ' and all settings on this device will be gone. The game restarts like a fresh install.',
       [['Yes, erase everything', 'warn', () => wipeAndReload(null)]], back)]], back);
}
function refreshSettings(){ if (settingsFrom && !$('#modal').hidden && document.getElementById('upd-st')) showSettings(settingsFrom); }
function boot(data){
  applyLayout();
  if (UPD.auto) setTimeout(() => checkAppUpdate(false), 2500);
  const raw = (data && data.S) || loadSaved();
  S = mergeState(raw);
  M = mods();
  if (!raw) S.life.hp = M.maxHp;
  if (S.set.startPaused && !S.life.dead) S.set.paused = true;   // option: open the game paused
  delete S.bank; delete S.set.boost; delete S.set.boostX; delete S.set.bgPause;   // removed: banked time, the stasis boost, background pause
  pinChains();
  unlockSpeeds(true);
  setTab('tasks');
  if (raw) showMenu(); else startGame();
  last = performance.now();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({S: JSON.parse(JSON.stringify(S))})); } catch(e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
