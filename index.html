<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111a20">
<title>Long Patience</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column ship console. Sticky readout header, scrolling task list, fixed tab bar. Single dark look (emergency lighting) by choice. */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
:root{
  --bg:#0b1115; --panel:#111a20; --panel2:#16222a; --line:#22323c; --fg:#d2dbe0; --dim:#7b8c96; --faint:#4a5c67;
  --amber:#f0a03c; --amber-soft:rgba(240,160,60,.14); --amber-fill:rgba(240,160,60,.22);
  --cyan:#63c6d4; --cyan-soft:rgba(99,198,212,.16); --red:#e2604f; --green:#7cc47f; --violet:#a98cf0; --sand:#d8c49a;
  --f-disp:'Saira Condensed','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--dim);font-weight:600}

/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border-bottom:1px solid var(--line);padding-block:10px 10px}
#hud .wrap{display:grid;gap:7px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ident{display:flex;align-items:baseline;gap:8px;min-width:0}
.ident b{font-family:var(--f-disp);font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--amber);line-height:1}
.ident span{font-family:var(--f-disp);font-size:14px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.spd{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.spd button{font-family:var(--f-mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.spd button.on{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.spd button.mus{font-size:14px;padding:3px 9px;color:var(--faint);text-decoration:line-through}
.spd button.mus.on{color:var(--cyan);border-color:var(--cyan-soft);background:none;text-decoration:none}
.vol{display:grid;grid-template-columns:auto 1fr 34px;gap:10px;align-items:center}
.vol b{font-size:12px;text-align:right;font-weight:500}
.mpanel{background:var(--panel2)}
.spd button.pause{color:var(--fg)}
.spd button.pause.on{background:var(--cyan);border-color:var(--cyan);color:var(--bg)}
.now.paused{border-color:var(--cyan)}
.spd button.boost{color:var(--cyan);border-color:var(--cyan-soft)}
.spd button.boost.on{background:var(--cyan);color:var(--bg)}
.meter{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:8px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px}
.bar.hp i{background:var(--red)}
.bar.xp i{background:var(--cyan)}
.meter span{font-size:12px;color:var(--fg);min-width:92px;text-align:right}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res>div{display:flex;align-items:baseline;gap:6px;background:var(--panel2);border-radius:4px;padding:5px 8px;min-width:0}
.res b{font-size:15px;font-weight:500}
.res .cap{font-size:11px;color:var(--faint);font-weight:400}
.res b.full{color:var(--amber)}
.res>div{flex-wrap:wrap}
.res small.rt{flex-basis:100%;margin-left:0;color:var(--dim);font-size:11px}
.res small.rt.neg{color:var(--red)}
.surv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px}
.surv b{font-size:14px;font-weight:500}
.surv span{color:var(--dim)}
.surv em{font-style:normal;margin-left:auto;color:var(--dim)}
.surv .strain{flex-basis:100%;color:var(--dim)}
.surv .strain.hi{color:var(--red)}
.task.rest .tm{border-style:dashed}
.surv.warn b,.surv.warn em{color:var(--red)}
.tx .tt{color:var(--dim)}
.eat{flex-basis:100%;margin-top:4px;font-size:12px;padding:5px 8px;border:1px solid var(--green);color:var(--green);border-radius:4px;text-align:center}
.eat:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.res small{font-size:11px;margin-left:auto;white-space:nowrap}
.pos{color:var(--green)} .neg{color:var(--red)}
.now{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;padding:7px 9px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:34px}
.now .nf{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber-fill)}
.now span{position:relative;min-width:0}
#n-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#n-eta{font-size:12px;color:var(--dim);white-space:nowrap}
.now.idle{border-color:var(--amber);animation:blink 1.6s ease-in-out infinite}
.now.forage{border-color:var(--green)}
@keyframes blink{50%{border-color:var(--line)}}

/* main */
main{padding-block:12px 100px}
main .wrap{display:grid;gap:18px}
.view{display:grid;gap:18px}
.view[hidden]{display:none!important}

/* queue */
.qp{display:grid;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:6px}
.qh{display:flex;justify-content:space-between;align-items:center}
.qh button{font-size:12px;color:var(--dim);padding:3px 6px}
.qlist{display:flex;flex-wrap:wrap;gap:6px}
.qchip{font-size:12px;padding:5px 8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);text-align:left}
.qchip i{font-style:normal;color:var(--faint);margin-left:6px}
.qchip.blocked{opacity:.55}
.qnote{font-size:12px;color:var(--dim)}
.qnote b{color:var(--fg);font-weight:500}

/* zones and tasks */
.zone{display:grid;gap:6px}
.zh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:5px}
.zh h2{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.zh span{font-size:12px;color:var(--dim)}
.zh em{margin-left:auto;font-style:normal;font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.sub{font-family:var(--f-disp);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.task{display:flex;gap:6px;align-items:stretch}
.tm{position:relative;flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:5px;padding:9px 10px;overflow:hidden;background:var(--panel)}
.tm .tf{position:absolute;inset:0 auto 0 0;width:0;background:var(--amber-soft);pointer-events:none}
.tm>div{position:relative}
.th{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tn{font-weight:500;font-size:14.5px;min-width:0}
.te{font-size:12px;color:var(--dim);white-space:nowrap}
.tx{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:5px;align-items:center;font-size:12px;color:var(--dim)}
.chip{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border-radius:3px;border:1px solid currentColor;line-height:1.5}
.c-eng{color:var(--amber)} .c-bio{color:var(--green)} .c-cbt{color:var(--red)} .c-hak{color:var(--violet)} .c-nav{color:var(--cyan)} .c-res{color:var(--sand)}
.haz{color:var(--red)}
.star{color:var(--amber)}
.task.job .tm{background:var(--panel2)}
.task.on .tm{border-color:var(--amber)}
.task.job .tm .tf{background:var(--amber-soft)}
.task.job:not(.on) .tm .tf{opacity:.45}
.tf.fast,.nf.fast{width:100%!important;opacity:.6}
.task.fb .tn::after{content:" · fallback";color:var(--faint);font-size:11px;font-weight:400}
.tq{flex:0 0 44px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:18px;color:var(--dim)}
.side{display:flex;flex-direction:column;gap:4px;flex:0 0 52px}
.side .tq{flex:1 1 auto;min-height:36px}
.ta{flex:0 0 52px;border:1px solid var(--line);border-radius:5px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);padding:6px 0}
.side .ta{flex:0 0 auto}
.ta.on{background:var(--cyan-soft);border-color:var(--cyan);color:var(--cyan)}
.tq.in{color:var(--amber);border-color:var(--amber);font-size:12px}
.task.lock .tm{opacity:.45;cursor:default;border-style:dashed}
.task.lock .tq{visibility:hidden}

/* skills */
.sk{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}
.skh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.skh h3{margin:0;font-family:var(--f-disp);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.skh b{font-family:var(--f-mono);font-size:16px;font-weight:500}
.skm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.note{font-size:13px;color:var(--dim);max-width:62ch;margin:0}
.panel{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:4px;background:var(--panel)}
.h2{margin:0;font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* gear */
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item>div{flex:1;min-width:0}
.item h3{margin:0;font-size:14.5px;font-weight:500}
.item p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.buy{font-family:var(--f-mono);font-size:12px;padding:8px 10px;border-radius:4px;border:1px solid var(--amber);color:var(--amber);white-space:nowrap;min-width:84px}
.buy:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.owned{font-family:var(--f-mono);font-size:12px;color:var(--green);min-width:84px;text-align:center}

/* archive */
.perk{padding:9px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.perk h3{margin:0;font-size:14px;font-weight:500;color:var(--amber)}
.perk p{margin:0;font-size:12px;color:var(--dim)}
.perk.no h3{color:var(--faint)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--panel2);border-radius:4px;padding:8px}
.stats b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px}
.stats span{font-size:11px;color:var(--dim)}
.set{display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row p{margin:0;font-size:13px}
.row small{display:block;color:var(--dim);font-size:12px}
.tog{width:46px;height:26px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .15s}
.tog.on{background:var(--amber-fill);border-color:var(--amber)}
.tog.on::after{transform:translateX(20px);background:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber)}
.btn{font-size:13px;padding:9px 12px;border-radius:5px;border:1px solid var(--line);color:var(--fg)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--bg);font-weight:600}

/* log */
.le{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:3px}
.le header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.le h3{margin:0;font-size:14px;font-weight:500}
.le time{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.le p{margin:0;font-size:13px;color:var(--dim);max-width:62ch}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
#tabs button{position:relative;padding:12px 0 13px;font-family:var(--f-disp);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:600}
#tabs button.on{color:var(--amber)}
#tabs button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--amber)}
#tabs button.dot::after{content:"";position:absolute;top:9px;right:18%;width:6px;height:6px;border-radius:50%;background:var(--cyan)}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,9,12,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;max-width:440px;width:100%;max-height:100%;overflow:auto;display:grid;gap:12px}
.mbox h2{margin:0;font-family:var(--f-disp);font-size:26px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--amber);line-height:1.1;text-wrap:balance}
.mbox p{margin:0;font-size:14px;color:var(--fg)}
.mbox p.d{color:var(--dim);font-size:13px}
.mbox ul{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13px;color:var(--dim)}
.mbox ul b{color:var(--fg);font-weight:500}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt td{padding:4px 0;border-bottom:1px solid var(--line)}
.dt td:not(:first-child){text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--cyan)}
#toasts{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:15;display:grid;justify-items:center;gap:6px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 12px;font-size:13px;max-width:420px;animation:tin .2s ease-out}
.toast.gold{border-color:var(--amber);color:var(--amber)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.fld{display:grid;gap:4px}
.fld label{font-size:12px;color:var(--dim)}
.fld input,.fld textarea{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:8px;font:13px var(--f-mono)}
.fld textarea{min-height:64px;resize:vertical;word-break:break-all}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.ghst{font-size:12px;color:var(--dim);min-height:1.4em}
.ghst.err{color:var(--red)} .ghst.ok{color:var(--green)}
.note a{color:var(--cyan)}
.menub{font-size:18px;line-height:1;padding:4px 8px 5px;border:1px solid var(--line);border-radius:4px;color:var(--fg);align-self:center}
.mbtns{display:grid;gap:8px}
.mbtns .btn{text-align:left;padding:11px 12px}
.mbtns small{display:block;font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
.slots{display:grid;gap:8px}
.slot{display:grid;gap:6px;text-align:left;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel2)}
.slot.act{border-color:var(--amber)}
.slot b{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.slot span{font-size:12px;color:var(--dim)}
.slot em{font-style:normal;font-size:12px;color:var(--amber)}
.slot .btn{padding:6px 10px;font-size:12px}
.lockbtn{font-size:12px;color:var(--faint);text-align:left;padding:4px 2px}
.mapwrap{overflow-x:auto}
.mapwrap svg{display:block;max-width:100%;height:auto}
.mn{cursor:pointer}
.mn .mb{fill:var(--panel);stroke:var(--line);stroke-width:1}
.mn .mf{fill:var(--amber-soft)}
.mn text{fill:var(--fg);font-family:var(--f-body);font-size:11.5px;font-weight:500}
.mn .ms{fill:var(--dim);font-family:var(--f-mono);font-size:9.5px;font-weight:400}
.mn.rest .mb{stroke-dasharray:4 3}
.mn.done .mb{stroke:var(--amber)}
.mn.done .mf{fill:var(--amber-fill)}
.mn.cur .mb{stroke:var(--amber);stroke-width:2}
.mn.cur .mb{filter:drop-shadow(0 0 4px rgba(240,160,60,.55))}
.mn.lock{opacity:.4}
.me{fill:none;stroke:var(--line);stroke-width:1.5}
.me.lit{stroke:var(--amber);opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header id="hud" class="gut">
  <div class="wrap">
    <div class="r1">
      <div class="ident"><button class="menub" data-menu="open" aria-label="Main menu">☰</button><b>K-7</b><span id="h-gen">Clone 1</span></div>
      <div class="spd" id="h-spd"></div>
    </div>
    <div class="meter"><span class="lbl" style="min-width:0;text-align:left">Life</span><div class="bar"><i id="b-age"></i></div><span id="t-age" class="num"></span></div>
    <div class="meter"><span class="lbl" style="min-width:0;text-align:left">Health</span><div class="bar hp"><i id="b-hp"></i></div><span id="t-hp" class="num"></span></div>
    <div class="surv" id="surv"><span class="lbl">Time left</span><b id="s-left" class="num"></b><span id="s-real" class="num"></span><em id="s-why"></em><span id="s-strain" class="num strain"></span></div>
    <div class="res">
      <div><span class="lbl">Rations</span><b id="t-rat" class="num"></b><small id="t-ratr" class="num"></small><small id="t-ratt" class="rt num"></small><button id="eatb" class="eat num" data-eat>Eat</button></div>
      <div><span class="lbl">Salvage</span><b id="t-sal" class="num"></b><small id="t-salr" class="num"></small><small id="t-salt" class="rt num"></small></div>
    </div>
    <div class="now" id="now"><div class="nf" id="n-fill"></div><span id="n-name"></span><span id="n-eta" class="num"></span></div>
  </div>
</header>

<main class="gut">
  <div class="wrap">
    <section class="view" id="v-tasks"></section>
    <section class="view" id="v-map" hidden></section>
    <section class="view" id="v-skills" hidden></section>
    <section class="view" id="v-gear" hidden></section>
    <section class="view" id="v-archive" hidden></section>
    <section class="view" id="v-log" hidden></section>
  </div>
</main>

<nav id="tabs" class="gut" aria-label="Sections">
  <div class="wrap">
    <button data-tab="tasks" class="on">Tasks</button>
    <button data-tab="map">Map</button>
    <button data-tab="skills">Skills</button>
    <button data-tab="gear">Gear</button>
    <button data-tab="archive">Archive</button>
    <button data-tab="log">Log</button>
  </div>
</nav>

<div id="toasts"></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script id="logic">
/* ===== Game data and rules (no DOM) ===== */
const DPS = 4;             // simulation ticks per real second at 1x
// Time is simulated in ticks. 80 ticks make one ship day (18 minutes each), so a day lasts
// 20 real seconds at 1x and a clone lives weeks, not years. Everything is shown in days and hours.
const TPD = 80;
const JOB_CYCLE = 8;       // in-game days of base work per job batch
const MEAL_CD = 20;        // ticks between meals: one ration every 6 hours, 4 a day
const EAT = 1 / MEAL_CD;   // average rations eaten per tick (used for estimates)
const HUNGER = 0.15;       // base health lost per tick, always, while time runs
// Strain: the body wears down. The hunger drain is multiplied by strain, which climbs
// steadily (+1 every STRAIN_RAMP ticks = 5 days). Rest actions halve it again.
const STRAIN_RAMP = 400, AUTO_REST_AT = 1.8;

function newLife(s){

  const L = {day:0, hp:100, rations:p.decant?6:0, salvage:p.decant?4:0, lv:{}, xp:{}, echo0:{},
    done:{}, prog:{}, cyc:{}, bat:{}, meal:0, strain:1, job:null, queue:[], owned:{}, order:[], foraging:false, cur:null, dead:false, cause:''};
  SKILLS.forEach(k => { L.lv[k.id] = 0; L.xp[k.id] = 0; L.echo0[k.id] = s.echo[k.id] || 0; });

}

// The clone template is unstable at first: early clones die young. Each decanting refines it
// by one year until it reaches the full 14 (death at 28). Lifespan records add on top.
const TEMPLATE_MIN = 6, TEMPLATE_MAX = 14, TEMPLATE_STEP = 1;
function templateYears(){ return Math.min(TEMPLATE_MAX, TEMPLATE_MIN + TEMPLATE_STEP * (S.gen - 1)); }
function mods(){
  const L = S.life, P = S.perks;
  const m = {sk:{}, xpSk:{}, spd:1, xp:1, haz:1, maxHp:100 + Math.floor(S.vit || 0), pRat:0, pSal:0, life:templateYears(), regen:0.05, ratCap:10, salCap:25};
  SKILLS.forEach(k => { m.sk[k.id] = 1; m.xpSk[k.id] = 1; });
  const ap = e => {
    if (!e) return;
    if (e.sk) for (const k in e.sk) m.sk[k] *= e.sk[k];
    if (e.xpSk) for (const k in e.xpSk) m.xpSk[k] *= e.xpSk[k];
    if (e.spd) m.spd *= e.spd; if (e.xp) m.xp *= e.xp; if (e.haz) m.haz *= e.haz;
    if (e.maxHp) m.maxHp += e.maxHp; if (e.pRat) m.pRat += e.pRat; if (e.pSal) m.pSal += e.pSal;
    if (e.life) m.life += e.life; if (e.regen) m.regen *= e.regen;
    if (e.ratCap) m.ratCap += e.ratCap; if (e.salCap) m.salCap += e.salCap;
  };
  PERKS.forEach(p => { if (P[p.id]) ap(p.eff); });
  ITEMS.forEach(i => { if (L.owned[i.id]) ap(i.eff); });
  TASKS.forEach(t => { if (t.lifeEff && isDone(t.id)) ap(t.lifeEff); });
  return m;
}
// Each level makes work 10% faster; levels come slowly.
const xpNeed = l => 152.6 * Math.pow(1.61051, l);
const echoMult = s => Math.pow(1.58, S.echo[s]);
const isDone = id => (S.life.done[id] || 0) >= T[id].reps;
const available = t => t.req.every(isDone);
const complete = t => t.kind === 'act' && isDone(t.id);
const lifeDays = () => M.life * 365;
function skF(s){ return (1 + 0.1 * S.life.lv[s]) * M.sk[s]; }
// Frailty: in the last quarter of a clone's life, all work slows down, to 60% at the very end.
function frailty(){ const f = S.life.day / lifeDays(); return f < 0.75 ? 1 : 1 - 1.6 * (f - 0.75); }
function speedOf(t){ let p = 1; t.sk.forEach(s => p *= skF(s)); return Math.pow(p, 1 / t.sk.length) * M.spd * frailty(); }
function hazDmg(t){ const L = S.life; return (t.haz || 0) * M.haz / (1 + 0.2 * L.lv.cbt + 0.3 * L.lv.res); }
function xpRate(t, s){ return ZT[t.z] * M.xp * M.xpSk[s] * echoMult(s); }

function pickFood(){
  let best = null, br = 0;
  TASKS.forEach(t => {
    if (t.kind === 'job' && t.prod && t.prod.rations && available(t)) {
      const r = t.prod.rations * speedOf(t); if (r > br) { br = r; best = t; }
    }
  });
  return best;
}
function active(){
  const L = S.life;
  if (S.perks.survival && S.set.autoFood) {
    const food = pickFood();
    if (food) {
      const low = Math.min(S.set.foodDays, M.ratCap * 0.5);
      if (L.rations < low) L.foraging = true;
      if (L.foraging && L.rations >= Math.min(low * 2, M.ratCap - 0.5)) L.foraging = false;
      if (L.foraging) return food;
    }
  } else L.foraging = false;
  if ((L.strain || 1) >= AUTO_REST_AT) { const r = TASKS.find(t => t.kind === 'rest' && isAuto(t) && available(t)); if (r) return r; }
  for (const id of L.queue) { const t = T[id]; if (available(t) && !complete(t)) return t; }
  // automated actions run on their own, in ship order, once the queue is done
  for (const t of TASKS) if (t.kind === 'act' && isAuto(t) && available(t) && !complete(t)) return t;
  if (L.job && available(T[L.job])) {
    const j = T[L.job];
    if (!jobFull(j)) return j;
    L.job = null; HOOK.stopped(j);   // storage full: unselect it
  }
  // automated jobs: the one whose storage is emptiest; stop when all are full
  let best = null, br = 2;
  for (const t of TASKS) if (t.kind === 'job' && isAuto(t) && available(t) && !jobFull(t)) {
    const r = t.prod ? storeRatio(t) : 1.5; if (r < br) { br = r; best = t; }
  }
  return best;
}
// Practice is counted in lives: an action counts once per life when finished; a job counts once per
// life after JOB_PRAC_BATCHES batches in that life. AUTO_LIVES practised lives unlock automation.
// can be automated.
const AUTO_LIVES = 10, JOB_PRAC_BATCHES = 10;
function practiced(t){ return (S.prac[t.id] || 0) >= AUTO_LIVES; }
function addPractice(t){ S.prac[t.id] = (S.prac[t.id] || 0) + 1; if (S.prac[t.id] === AUTO_LIVES) HOOK.practiced(t); }
function isAuto(t){ return !!S.auto[t.id] && practiced(t); }
function storeRatio(t){ return t.prod && t.prod.rations ? S.life.rations / M.ratCap : t.prod && t.prod.salvage ? S.life.salvage / M.salCap : 0; }
function jobFull(t){
  if (!t.prod) return false;
  const L = S.life;
  if (t.prod.rations) return L.rations >= M.ratCap - 0.01;
  if (t.prod.salvage) return L.salvage >= M.salCap - 0.01;
  return false;
}
function gainXp(s, a){
  const L = S.life; L.xp[s] += a;
  let n = xpNeed(L.lv[s]);
  while (L.xp[s] >= n) { L.xp[s] -= n; L.lv[s]++; n = xpNeed(L.lv[s]); }
}
function finish(t){
  const L = S.life;
  L.done[t.id] = (L.done[t.id] || 0) + 1;
  if (!S.ever) S.ever = {};
  S.ever[t.id] = 1;
  if (t.kind === 'rest') {
    L.strain = Math.max(1, (L.strain || 1) / 2);
    L.queue = L.queue.filter(x => x !== t.id);
    if (L.done[t.id] === 1) addPractice(t);
    HOOK.rested(t); HOOK.change();
    return;
  }
  const r = t.reward || {};
  if (r.salvage) L.salvage += r.salvage;
  if (r.rations) L.rations += r.rations;
  if (!L.order.includes(t.id)) L.order.push(t.id);
  if (complete(t)) {
    L.queue = L.queue.filter(x => x !== t.id);
    addPractice(t);
  }
  M = mods();
  clampRes();
  if (r.heal) L.hp = M.maxHp;
  if (complete(t) && t.log && !S.logged[t.id]) { S.logged[t.id] = 1; HOOK.log(t.name, t.log); }
  HOOK.done(t);
  if (complete(t) && t.perk && !S.perks[t.perk]) { S.perks[t.perk] = true; M = mods(); HOOK.perk(PK[t.perk]); }
  if (t.win && !S.won) { S.won = true; S.winGen = S.gen; HOOK.win(); }
  HOOK.change();
}
function die(cause){
  const L = S.life; L.dead = true; L.cause = cause; L.cur = null;
  const age = L.day / TPD;
  SKILLS.forEach(k => { if (L.lv[k.id] > S.echo[k.id]) S.echo[k.id] = L.lv[k.id]; });
  // Hardened genome: every full day a clone survives adds 1 max health to all later clones.
  L.vitGain = Math.floor(L.day / TPD);
  S.vit = (S.vit || 0) + L.vitGain;
  S.stats.deaths++; S.stats.daysLived += L.day;
  if (age > (S.stats.bestDays || 0)) S.stats.bestDays = age;
  HOOK.die();
}
function step(dt){
  const L = S.life;
  const t = active(); L.cur = t ? t.id : null;
  if (!t) return false;      // nothing running: time stands still, like Increlution
  let hurt = false;
  if (t) {
    const sp = speedOf(t);
    t.sk.forEach(s => gainXp(s, xpRate(t, s) * dt));
    if (t.kind === 'job') {
      // Jobs work in batches: the bar fills over JOB_CYCLE days of work, then delivers and empties.
      L.cyc[t.id] = (L.cyc[t.id] || 0) + sp * dt / JOB_CYCLE;
      const n = Math.floor(L.cyc[t.id]);
      if (n > 0) {
        L.cyc[t.id] -= n;
        const before = L.bat[t.id] || 0; L.bat[t.id] = before + n;
        if (before < JOB_PRAC_BATCHES && L.bat[t.id] >= JOB_PRAC_BATCHES) addPractice(t);
        if (t.prod) { if (t.prod.rations) L.rations += t.prod.rations * JOB_CYCLE * n; if (t.prod.salvage) L.salvage += t.prod.salvage * JOB_CYCLE * n; }
      }
    } else {
      L.prog[t.id] = (L.prog[t.id] || 0) + sp * dt;
      if (L.prog[t.id] >= t.days) { L.prog[t.id] = 0; finish(t); }
    }
  }
  L.rations += M.pRat * dt;
  L.salvage += M.pSal * dt;
  clampRes();
  // Health drains all the time; hazards add to it. Meals put some back.
  L.strain = (L.strain || 1) + dt / STRAIN_RAMP;
  const drain = Math.min(HUNGER * L.strain + (t && t.haz ? hazDmg(t) : 0), MAX_DRAIN);
  L.hp -= drain * dt;
  L.meal = Math.max(0, (L.meal || 0) - dt);
  if (S.set.autoEat && L.meal <= 0 && L.rations >= 1 && L.hp <= M.maxHp - mealHp() / 2) eat();
  if (L.hp <= 0) {
    L.hp = 0;
    die(L.rations < 1 ? 'Starved' : (t && t.haz ? 'Killed while trying to ' + t.name.charAt(0).toLowerCase() + t.name.slice(1) : 'Collapsed from exhaustion'));
    return;
  }
  L.day += dt;
  if (L.day >= lifeDays()) die('Telomere collapse. The body wore out');
  return true;
}
function canEat(){ const L = S.life; return !L.dead && (L.meal || 0) <= 0 && L.rations >= 1; }
function eat(){
  const L = S.life; if (!canEat()) return false;
  L.rations -= 1; L.hp = Math.min(M.maxHp, L.hp + mealHp()); L.meal = MEAL_CD;
  return true;
}

    const body = {message:'Save: clone ' + S.gen + ', day ' + (L.day/TPD).toFixed(1) + (auto ? ' (auto)' : ''),
      content:b64enc(JSON.stringify(S, null, 1)), branch:GH.branch};
    if (cur.ok && cur.j && cur.j.sha) body.sha = cur.j.sha;
    const r = await ghFetch('PUT', body);
    if (!r.ok) { ghSetMsg(ghErr(r.status, 'save'), false); return; }
    GH.last = Date.now();
    const sha = r.j && r.j.commit ? r.j.commit.sha.slice(0, 7) : '';
    ghSetMsg('Uploaded at ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + (sha ? ' · commit ' + sha : '') + (auto ? ' (auto)' : '') + '.', true);
    if (!auto) toast('Save uploaded to GitHub');

    ghSetMsg('Couldn’t reach GitHub. Check your connection.', false);
  } finally { ghBusy = false; }
}

async function ghDownload(){
  if (ghBusy) return;
  if (!GH.token.trim()) { ghSetMsg('Paste a GitHub token first.', false); return; }
  ghBusy = true; ghSetMsg('Loading…', true);
  try {
    const r = await ghFetch('GET');
    if (!r.ok) { ghSetMsg(ghErr(r.status, 'load'), false); return; }
    let raw;
    try { raw = JSON.parse(b64dec(r.j.content)); } catch(e) { ghSetMsg('The file on GitHub isn’t a valid save.', false); return; }
    if (!raw || !raw.life) { ghSetMsg('The file on GitHub isn’t a valid save.', false); return; }
    applyLoaded(raw, 'GitHub');
    ghSetMsg('Loaded from GitHub at ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '.', true);
  } catch(e) {
    ghSetMsg('Couldn’t reach GitHub. Check your connection.', false);
  } finally { ghBusy = false; }
}

function mergeState(raw){
  const d = defaultState();
  if (!raw || typeof raw !== 'object' || !raw.life) return d;
  const s = Object.assign(d, raw);
  s.set = Object.assign(defaultState().set, raw.set || {});
  s.stats = Object.assign(defaultState().stats, raw.stats || {});
  if (!s.prac) s.prac = {}; if (!s.auto) s.auto = {};
  if (!s.ever) { s.ever = {}; TASKS.forEach(t => { if (t.kind !== 'job' && ((s.logged || {})[t.id] || (s.prac || {})[t.id] || (s.life && s.life.done && s.life.done[t.id]))) s.ever[t.id] = 1; }); }
  if (!raw.pv) {   // v2 practice: counted in lives (acts kept as-is, job days become at most 1 life)
    TASKS.forEach(t => { if (t.kind === 'job' && s.prac[t.id] != null) s.prac[t.id] = s.prac[t.id] >= 200 ? 1 : 0; });
  }
  s.pv = 2;
  if (!raw.rv) { s.set.foodDays = Math.max(2, Math.round(s.set.foodDays / 2)); if (s.life) s.life.rations = (s.life.rations || 0) / 2; }
  if ((raw.rv || 0) < 3) {   // v3: rations x0.4, salvage x0.25
    s.set.foodDays = Math.max(1, Math.round(s.set.foodDays * 0.4));
    if (s.life) { s.life.rations = (s.life.rations || 0) * 0.4; s.life.salvage = (s.life.salvage || 0) * 0.25; }
  }
  s.rv = 3;
  if (!raw.sv) {   // skill levels rescaled 5:1 in v2
    SKILLS.forEach(k => {
      s.echo[k.id] = Math.floor((s.echo[k.id] || 0) / 5);
      if (s.life && s.life.lv) { s.life.lv[k.id] = Math.floor((s.life.lv[k.id] || 0) / 5); s.life.xp[k.id] = 0; }
      if (s.life && s.life.echo0) s.life.echo0[k.id] = Math.floor((s.life.echo0[k.id] || 0) / 5);
    });
  }
  s.sv = 2;
  SKILLS.forEach(k => { if (s.echo[k.id] == null) s.echo[k.id] = 0; });
  const L = s.life;
  ['done','prog','cyc','bat','owned','lv','xp','echo0'].forEach(k => { if (!L[k]) L[k] = {}; });
  SKILLS.forEach(k => { if (L.lv[k.id] == null) L.lv[k.id] = 0; if (L.xp[k.id] == null) L.xp[k.id] = 0; });
  if (!Array.isArray(L.queue)) L.queue = [];
  L.queue = L.queue.filter(id => T[id]);
  if (L.job && !T[L.job]) L.job = null;
  if (!Array.isArray(L.order)) L.order = [];
  return s;
}

/* ----- map: every action ever performed, by section, wired by requirement ----- */
let mapKey = '', mapRefs = [];
const MW = 340, NH = 50, RG = 34, PAD = 8;
function wrap2(txt, max){
  const w = txt.split(' '), lines = ['']; 
  w.forEach(x => { const l = lines[lines.length - 1]; if ((l + ' ' + x).trim().length > max && lines.length < 2 && l) lines.push(x); else lines[lines.length - 1] = (l + ' ' + x).trim(); });
  if (lines[1] && lines[1].length > max) lines[1] = lines[1].slice(0, max - 1) + '…';
  return lines;
}
function renderMap(){
  const ever = S.ever || {};
  const key = Object.keys(ever).join() + '|' + S.gen;
  if (key === mapKey) return; mapKey = key;
  let h = '<div class="panel"><span class="h2">Ship map</span><p class="note">Every action your clones have ever performed, by section. Lines show what each one needs. Filled boxes are done in this life; the glowing one is in progress. Tap an action to work on it.</p></div>';
  let any = false;
  ZONES.forEach(z => {
    const nodes = TASKS.filter(t => t.kind !== 'job' && t.z === z.id && ever[t.id]);
    if (!nodes.length) return;
    any = true;
    const ids = new Set(nodes.map(t => t.id)), depth = {};
    const dOf = t => { if (depth[t.id] != null) return depth[t.id]; let d = 0; t.req.forEach(r => { if (ids.has(r)) d = Math.max(d, dOf(T[r]) + 1); }); return depth[t.id] = d; };
    nodes.forEach(dOf);
    const rows = [];
    nodes.forEach(t => (rows[depth[t.id]] = rows[depth[t.id]] || []).push(t));
    const pos = {};
    rows.forEach((row, ri) => {
      const n = row.length, gap = 8, w = (MW - PAD * 2 - gap * (n - 1)) / n;
      row.forEach((t, i) => pos[t.id] = {x: PAD + i * (w + gap), y: PAD + ri * (NH + RG), w});
    });
    const H = PAD * 2 + rows.length * NH + (rows.length - 1) * RG;
    let edges = '', boxes = '';
    nodes.forEach(t => {
      const p = pos[t.id];
      t.req.forEach(r => { if (!pos[r]) return; const q = pos[r];
        const x1 = q.x + q.w / 2, y1 = q.y + NH, x2 = p.x + p.w / 2, y2 = p.y, my = (y1 + y2) / 2;
        edges += `<path class="me" data-from="${r}" d="M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`; });
      const lines = wrap2(t.name, Math.max(10, Math.floor(p.w / 6.6)));
      const outside = t.req.filter(r => !ids.has(r) && T[r] && T[r].z !== z.id);
      boxes += `<g class="mn${t.kind === 'rest' ? ' rest' : ''}" data-mapdo="${t.id}" transform="translate(${p.x} ${p.y})">
        <rect class="mb" width="${p.w}" height="${NH}" rx="5"/>
        <rect class="mf" width="0" height="${NH}" rx="5"/>
        ${lines.map((l, i) => `<text x="8" y="${(lines.length === 1 ? 23 : 17) + i * 14}">${esc(l)}</text>`).join('')}
        <text class="ms" x="8" y="${NH - 7}"></text>
        ${outside.length ? `<title>Needs ${esc(outside.map(r => T[r].name).join(', '))}</title>` : ''}
      </g>`;
    });
    const entry = [...new Set(nodes.flatMap(t => t.req.filter(r => T[r] && T[r].z !== z.id)))].map(r => T[r].name);
    h += `<section class="zone"><header class="zh"><h2>${z.name}</h2><span>${z.sub}</span></header>
      ${entry.length ? `<p class="note">Reached from: ${esc(entry.join(', '))}</p>` : ''}
      <div class="mapwrap"><svg viewBox="0 0 ${MW} ${H}" width="100%" role="img" aria-label="Map of ${esc(z.name)}">${edges}${boxes}</svg></div></section>`;
  });
  if (!any) h += '<p class="note">Nothing mapped yet. Finish your first action to start the map.</p>';
  $('#v-map').innerHTML = h;
  mapRefs = [...document.querySelectorAll('#v-map .mn')].map(g => ({g, t:T[g.dataset.mapdo], f:g.querySelector('.mf'), s:g.querySelector('.ms'), w:+g.querySelector('.mb').getAttribute('width')}));
}
function updateMap(){
  const L = S.life;
  mapRefs.forEach(r => {
    const t = r.t, av = available(t), done = t.kind === 'act' && complete(t), cur = L.cur === t.id;
    r.g.classList.toggle('done', done); r.g.classList.toggle('cur', cur); r.g.classList.toggle('lock', !av && !done);
    let p = done ? 1 : (L.prog[t.id] || 0) / t.days;
    r.f.setAttribute('width', (Math.min(1, p) * r.w).toFixed(1));
    const sp = speedOf(t);
    r.s.textContent = done ? 'done' : !av ? 'locked' : t.kind === 'rest' ? 'rest · ' + fmtDays((t.days - (L.prog[t.id] || 0)) / sp)
      : (t.reps > 1 ? (L.done[t.id] || 0) + '/' + t.reps + ' · ' : '') + fmtDays((t.days * (t.reps - (L.done[t.id] || 0)) - (L.prog[t.id] || 0)) / sp);
  });
  document.querySelectorAll('#v-map .me').forEach(e => e.classList.toggle('lit', isDone(e.dataset.from)));
}
document.addEventListener('click', e => {
  const g = e.target.closest && e.target.closest('[data-mapdo]'); if (!g) return;
  const L = S.life, t = T[g.dataset.mapdo];

    renderSpeed(); return;
  }
  if ('eat' in d) { if (eat()) sfx('eat'), toast('Ate a ration. +' + fmt(mealHp()) + ' health'); return; }
  if ('ghUp' in d) { ghUpload(false); return; }
  if ('ghAuto' in d) { GH.auto = !GH.auto; if (GH.auto) GH.last = Date.now(); ghSave(); b.classList.toggle('on', GH.auto); b.setAttribute('aria-pressed', GH.auto); return; }
  if ('copysave' in d) {
    save();
    const code = b64enc(JSON.stringify(S));
    const ta = $('#save-code'); ta.value = code;
    const fallback = () => { ta.focus(); ta.select(); toast('Save code selected. Copy it from the box.'); };
    try { navigator.clipboard.writeText(code).then(() => toast('Save code copied'), fallback); } catch(e) { fallback(); }
    return;
  }
  if (L.dead && !d.confirm) return;
  if (d.do) {
    const t = T[d.do];
    if (t.kind === 'job') {
      if (jobFull(t)) { toast('Storage is full. Spend or use some first.'); return; }
      L.job = t.id; L.foraging = false;
      const q = L.queue.some(id => available(T[id]) && !complete(T[id]));
      if (q) toast('Set as fallback job. It runs once the queue is empty.');
    } else {
      L.queue = [t.id, ...L.queue.filter(x => x !== t.id)];
      L.foraging = false;
    }
    taskKey = ''; renderView(); return;
  }
  if (d.q) {
    if (!L.queue.includes(d.q)) { L.queue.push(d.q); toast('Queued: ' + T[d.q].name); }
    else { L.queue = L.queue.filter(x => x !== d.q); }
    taskKey = ''; renderView(); return;
  }
  if (d.auto) { S.auto[d.auto] = !S.auto[d.auto]; toast((S.auto[d.auto] ? 'Automated: ' : 'Automation off: ') + T[d.auto].name); taskKey = ''; renderView(); return; }
  if (d.showlock) { showLocked[d.showlock] = !showLocked[d.showlock]; taskKey = ''; renderView(); return; }
  if (d.unq) { L.queue = L.queue.filter(x => x !== d.unq); taskKey = ''; renderView(); return; }
  if ('clearq' in d) { L.queue = []; taskKey = ''; renderView(); return; }
  if (d.buy) {
    const it = IT[d.buy];
    if (L.salvage >= it.cost && !L.owned[it.id]) {
      L.salvage -= it.cost; L.owned[it.id] = true; M = mods();
      if (it.eff.maxHp) L.hp += it.eff.maxHp;
      toast('Built: ' + it.name); gearKey = ''; taskKey = ''; renderView();
    }
    return;
  }
  if (d.set) { S.set[d.set] = !S.set[d.set]; renderArchive(true); return; }
  if (d.confirm) {
    const k = d.confirm;
    if (!confirmT[k]) {
      confirmT[k] = setTimeout(() => { confirmT[k] = null; if (b.isConnected) b.textContent = ({reset:'Restart', recycle:'Recycle', ghload:'Load from GitHub', import:'Load pasted code'})[k]; }, 3000);
      b.textContent = 'Tap again'; return;
    }
    clearTimeout(confirmT[k]); confirmT[k] = null;
    if (k === 'ghload') { b.textContent = 'Load from GitHub'; ghDownload(); return; }
    if (k === 'import') {
      b.textContent = 'Load pasted code';
      let raw = null; const txt = $('#save-code').value.trim();
      try { raw = JSON.parse(txt.startsWith('{') ? txt : b64dec(txt)); } catch(e) {}
      if (!raw || !raw.life) { toast('That save code isn\u2019t valid.'); return; }
      applyLoaded(raw, 'save code'); return;
    }
    if (k === 'recycle' && !S.life.dead) die('Recycled by choice');
    if (k === 'reset') {
      S = defaultState(); M = mods(); S.life.hp = M.maxHp; resetViews(); save();
      setTab('tasks'); showIntro();
    }
  }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !S.life.dead && S.intro && !paused) hideModal(); });

function togglePause(){
  S.set.paused = !S.set.paused;
  toast(S.set.paused ? 'Paused. Time is stopped.' : 'Resumed');
  renderSpeed(); save();
}
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== 'p') return;
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'BUTTON' || !$('#modal').hidden) return;
  e.preventDefault(); togglePause();
});

/* ----- loop ----- */
let last = performance.now(), saveT = 0, viewT = 0;
function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 1.5) { S.bank = Math.min(S.bank + dt, 8*3600); dt = 0; }
  if (dt > 0 && !S.life.dead && !paused && !S.set.paused) {
    let mult = S.set.speed;
    if (S.set.boost && S.bank > 0) { mult *= 2; S.bank = Math.max(0, S.bank - dt); if (S.bank <= 0) S.set.boost = false; }
    advance(dt * DPS * mult);
  }
  updateHud();
  viewT += dt;
  if (tab === 'tasks') { renderTasks(); updateTasks(); }
  if (tab === 'map') { renderMap(); updateMap(); }
  if (viewT > 0.4) { viewT = 0; renderView(); }
  saveT += dt;
  if (saveT > 5) { saveT = 0; save(); if (GH.auto && GH.token && Date.now() - GH.last > GH_AUTO_MS) ghUpload(true); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

function boot(data){
  const raw = (data && data.S) || loadSaved();
  S = mergeState(raw);
  M = mods();
  if (!raw) S.life.hp = M.maxHp;
  if (raw && raw.saved) S.bank = Math.min((S.bank || 0) + Math.max(0, (Date.now() - raw.saved) / 1000), 8*3600);
  setTab('tasks');
  if (raw) showMenu(); else startGame();
  last = performance.now();
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({S: JSON.parse(JSON.stringify(S))})); } catch(e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
